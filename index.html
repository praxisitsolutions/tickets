<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRAXIS Tickets</title>
<meta name="theme-color" content="#0A5C73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRAXIS Tickets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<style>
:root{
  --side:#0A5C73; --side-ink:#D6EEF5; --side-dim:#8CC3D3;
  --primary:#0E7490; --primary-ink:#fff; --accent:#06B6D4;
  --bg:#EDF6FA; --surface:#FFFFFF; --sunken:#F4FAFC; --line:#D3E8EF; --line-strong:#B8DDE8;
  --text:#164E63; --dim:#5B8FA8; --faint:#8DB3C4;
  --ok:#0E7490; --warn:#C2780A; --bad:#C2321F; --done:#2F855A;
  --focus:0 0 0 3px rgba(6,182,212,.45);
}
:root[data-theme="dark"]{
  --side:#08222C; --side-ink:#CFE8F0; --side-dim:#6E9BAA;
  --primary:#22A6C4; --primary-ink:#04222C; --accent:#3DD3EC;
  --bg:#0C2A35; --surface:#113542; --sunken:#0F303C; --line:#1D4A59; --line-strong:#27606F;
  --text:#E2F2F7; --dim:#93BFCD; --faint:#5F8D9C;
  --ok:#3DD3EC; --warn:#F0A63A; --bad:#F2735E; --done:#5FCB8E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "DM Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:1.5px;line-height:1;padding:0 10px 22px;color:#fff}
.logo span{display:block;font-family:"DM Sans";font-size:12px;letter-spacing:.2px;color:var(--side-dim);font-weight:500;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button svg{flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(255,255,255,.12);color:#fff}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.side-foot button{border:0;background:none;color:var(--side-dim);text-align:left;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:14px}
.side-foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.who{padding:8px 12px;font-size:13px;color:var(--side-dim)}
.who b{display:block;color:var(--side-ink);font-weight:600}

main{min-width:0;padding:28px 36px 60px}
.page-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.2px}
.page-head .sp{flex:1}
.demo{background:#FEF3C7;color:#7C4A03;font-size:13px;padding:8px 14px;border-radius:8px;margin-bottom:18px}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--primary);border:1px solid var(--line-strong)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line-strong)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--dim)}
.icon-btn:hover{color:var(--primary)}
input.field,select.field,textarea.field{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%}
.search{max-width:320px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:22px}
.kpi{padding:18px 22px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .n{font-family:"Bebas Neue",sans-serif;font-size:44px;line-height:1;letter-spacing:.5px}
.kpi .l{font-size:13px;color:var(--dim);margin-top:6px}
.kpi.bad .n{color:var(--bad)}
.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:700}
.panel h2 small{font-weight:400;color:var(--dim);margin-left:6px;font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--primary);border-radius:4px}
.hbar .v{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;flex-direction:column;gap:22px}

/* ---------- ticket table ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--dim)}
.filters button.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.filters button em{font-style:normal;opacity:.7;margin-left:4px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 128px 130px 130px 150px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.trow:first-child{border-top:0}
button.trow:hover{background:var(--sunken)}
.thead{font-size:12px;color:var(--dim);font-weight:600;background:var(--sunken)}
.tno{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;font-weight:600}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.prio i{width:8px;height:8px;border-radius:50%}
.status{font-size:13px;font-weight:600}
.st-new{color:var(--accent)} .st-open{color:var(--primary)} .st-wait{color:var(--warn)} .st-done{color:var(--done)} .st-closed{color:var(--faint)}
.sla{display:block;font-size:12px;color:var(--dim)}
.sla .bar{display:block;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.sla .bar i{display:block;height:100%;background:var(--ok)}
.sla.warn{color:var(--warn)} .sla.warn .bar i{background:var(--warn)}
.sla.bad{color:var(--bad)} .sla.bad .bar i{background:var(--bad)}
.sla.met{color:var(--done)}
.empty{padding:48px 20px;text-align:center;color:var(--dim)}
.empty .btn{margin-top:14px}

/* ---------- ticket detail ---------- */
.back{border:0;background:none;color:var(--dim);padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.back:hover{color:var(--primary)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.dhead h1{font-size:22px;margin:4px 0 6px;line-height:1.3;overflow-wrap:anywhere}
.dhead .meta{font-size:13px;color:var(--dim)}
.timeline{margin-top:18px;display:flex;flex-direction:column}
.ev{position:relative;padding:0 0 18px 26px}
.ev::before{content:"";position:absolute;left:7px;top:22px;bottom:0;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .dot{position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.ev.in .dot{border-color:var(--accent)}
.ev.out .dot{background:var(--primary);border-color:var(--primary)}
.ev.note .dot{border-color:var(--warn);border-style:dashed}
.ev.sys .dot{width:10px;height:10px;left:3px;top:8px;background:var(--line-strong);border:0}
.ev .who2{font-size:13px;color:var(--dim)}
.ev .who2 b{color:var(--text)}
.ev .msg{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ev.out .msg{border-color:var(--primary)}
.ev.note .msg{background:var(--sunken);border-style:dashed}
.ev.sys{padding-bottom:12px}
.ev.sys .who2{font-size:13px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--text);color:var(--bg)}
.composer textarea{border:0;background:transparent;width:100%;resize:vertical;min-height:80px;padding:4px 2px}
.composer textarea:focus{box-shadow:none}
.crow{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.crow select{max-width:230px}
.props{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 16px;position:sticky;top:20px}
.prop{padding:11px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop label,.prop .k{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:600}
.prop .v{font-size:14px;overflow-wrap:anywhere}
.prop .v a{color:var(--primary)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.computed{font-size:12px;color:var(--dim);margin-top:6px}
.inline-warn{font-size:13px;color:var(--warn);margin-top:6px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,30,38,.45);z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border-radius:14px;z-index:51;box-shadow:0 24px 64px rgba(6,30,38,.35)}
.modal header{padding:18px 22px 4px;font-weight:700;font-size:18px}
.modal form{padding:10px 22px 22px;display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim);font-weight:600}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.modal .acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90%}
.toast.err{background:var(--bad);color:#fff}

/* ---------- login ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--side)}
.gate .card{background:var(--surface);border-radius:16px;padding:36px 32px;max-width:400px;width:100%}
.gate .logo{color:var(--side);padding:0 0 6px;font-size:40px}
.gate p{color:var(--dim);margin:0 0 22px}
.gate .btn{width:100%;justify-content:center;padding:12px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside.side{display:none}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .mtop{display:flex!important}
  .page-head{margin-bottom:14px}
  .page-head h1{font-size:20px}
  .page-head .newbtn{display:none}
  .search{max-width:none;order:3;flex-basis:100%}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:14px 16px}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi .n{font-size:36px}
  .dash{grid-template-columns:1fr}
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
  .trow .c-no{display:none}
  .trow .c-type{display:none}
  .trow .c-prio{grid-column:2;grid-row:1;justify-self:end}
  .trow .c-status{grid-column:2;grid-row:2;justify-self:end}
  .trow .c-sla{grid-column:1 / span 2}
  .detail{grid-template-columns:1fr}
  .props{position:static}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:6px 0}
  .tabbar button.on{color:var(--primary)}
  .tabbar .plus{color:var(--primary-ink)}
  .tabbar .plus span{width:44px;height:44px;border-radius:12px;background:var(--primary);display:grid;place-items:center;margin-top:-2px}
  .modal .grid2{grid-template-columns:1fr}
}
.mtop{display:none;align-items:center;gap:10px;margin:-2px 0 14px}
.mtop .logo{color:var(--text);padding:0;font-size:24px}
.mtop .sp{flex:1}
</style>
</head>
<body>
<div id="root"><div class="spin"></div></div>
<div id="layer"></div>

<script>
"use strict";
const CFG = window.PRAXIS_CONFIG || {};
const DEMO = !CFG.clientId || !CFG.tenantId || /[?&]demo\b/.test(location.search);

/* ================= vocabulary ================= */
const STATUSES = ["Νέο","Ανατέθηκε","Σε εξέλιξη","Αναμονή πελάτη","Αναμονή προμηθευτή","Επιλύθηκε","Κλειστό"];
const OPEN = ["Νέο","Ανατέθηκε","Σε εξέλιξη","Αναμονή πελάτη","Αναμονή προμηθευτή"];
const ST_CLASS = {"Νέο":"st-new","Ανατέθηκε":"st-open","Σε εξέλιξη":"st-open","Αναμονή πελάτη":"st-wait","Αναμονή προμηθευτή":"st-wait","Επιλύθηκε":"st-done","Κλειστό":"st-closed"};
const PRIORITIES = ["P1 Κρίσιμο","P2 Υψηλό","P3 Κανονικό","P4 Χαμηλό"];
const PRIO_COLOR = {"P1 Κρίσιμο":"var(--bad)","P2 Υψηλό":"var(--warn)","P3 Κανονικό":"var(--primary)","P4 Χαμηλό":"var(--faint)"};
const TYPES = ["Περιστατικό","Αίτημα υπηρεσίας","Πρόβλημα","Αλλαγή"];
const LEVELS = ["Υψηλή","Μεσαία","Χαμηλή"];
const IMPACT_HINT = {"Υψηλή":"όλη η επιχείρηση ή πολλοί χρήστες","Μεσαία":"ένα τμήμα ή μια ομάδα","Χαμηλή":"ένας χρήστης"};
const URGENCY_HINT = {"Υψηλή":"η δουλειά έχει σταματήσει","Μεσαία":"δυσκολεύει τη δουλειά","Χαμηλή":"μπορεί να περιμένει"};
const MATRIX = { "Υψηλή":{"Υψηλή":"P1 Κρίσιμο","Μεσαία":"P2 Υψηλό","Χαμηλή":"P3 Κανονικό"},
                 "Μεσαία":{"Υψηλή":"P2 Υψηλό","Μεσαία":"P3 Κανονικό","Χαμηλή":"P4 Χαμηλό"},
                 "Χαμηλή":{"Υψηλή":"P3 Κανονικό","Μεσαία":"P4 Χαμηλό","Χαμηλή":"P4 Χαμηλό"} };
const CATEGORIES = ["Δίκτυο","Email / M365","Server","Υπολογιστής","Εκτυπωτής","VoIP","Ασφάλεια","Λογισμικό","Άλλο"];
const SOURCES = ["Email","Τηλέφωνο","Web"];
const TIERS = Object.keys(CFG.tierSla || {"Χωρίς σύμβαση":0});
const DIR = {IN:"Από πελάτη", OUT:"Απάντηση προς πελάτη", NOTE:"Εσωτερική σημείωση", SYS:"Ιστορικό"};
const TECHS = CFG.technicians || [];
const PREFIX = CFG.ticketPrefix || "PRX-";
const SLA_M = CFG.slaMatrix || {"P1 Κρίσιμο":{response:60,resolve:240},"P2 Υψηλό":{response:120,resolve:480},"P3 Κανονικό":{response:240,resolve:960},"P4 Χαμηλό":{response:480,resolve:2400}};
const BH = CFG.businessHours || {start:9,end:17,days:[1,2,3,4,5]};
const HOLI = new Set(CFG.holidays || []);

const S = { view:"dash", filter:"open", q:"", tickets:[], clients:[], me:{name:"",email:""}, open:null, comments:[] };
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ticketNo = id => PREFIX + String(id).padStart(5,"0");
const nowIso = () => new Date().toISOString();

/* ================= business-hours time (Europe/Athens) ================= */
const TZF = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function wall(d){ const p = Object.fromEntries(TZF.formatToParts(d).map(x=>[x.type,x.value])); return new Date(Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second)); }
function unwall(w){ let t = w.getTime(); for(let i=0;i<2;i++){ const off = wall(new Date(t)).getTime() - t; t = w.getTime() - off; } return new Date(t); }
const dayKey = w => w.toISOString().slice(0,10);
const isWorkDay = w => BH.days.includes(w.getUTCDay()) && !HOLI.has(dayKey(w));
const atHour = (w,h) => new Date(Date.UTC(w.getUTCFullYear(), w.getUTCMonth(), w.getUTCDate(), h));
const nextDayStart = w => atHour(new Date(w.getTime() + 86400000), BH.start);
function addBusiness(startUtc, minutes){
  let w = wall(new Date(startUtc)), left = minutes;
  for(let guard=0; guard<400; guard++){
    if(!isWorkDay(w)){ w = nextDayStart(w); continue; }
    const open = atHour(w,BH.start), close = atHour(w,BH.end);
    if(w < open){ w = open; continue; }
    if(w >= close){ w = nextDayStart(w); continue; }
    const avail = (close - w) / 60000;
    if(left <= avail) return unwall(new Date(w.getTime() + left*60000)).toISOString();
    left -= avail; w = nextDayStart(w);
  }
  return null;
}
function businessBetween(aUtc, bUtc){
  let a = wall(new Date(aUtc)), b = wall(new Date(bUtc));
  if(b <= a) return 0;
  let total = 0, d = atHour(a, 0);
  for(let guard=0; guard<400 && d < b; guard++){
    if(isWorkDay(d)){
      const s = Math.max(atHour(d,BH.start), a), e = Math.min(atHour(d,BH.end), b);
      if(e > s) total += (e - s) / 60000;
    }
    d = new Date(d.getTime() + 86400000);
  }
  return total;
}
const fmtMin = m => { m = Math.round(Math.abs(m)); const h = Math.floor(m/60), r = m%60; if(h >= 16) return Math.round(h/8) + " εργ. ημ."; return h ? (r ? `${h}ω ${r}λ` : `${h}ω`) : `${r}λ`; };

/* ================= SLA ================= */
function clientOf(t){ return S.clients.find(c => c.name === t.client); }
function slaTargets(tier, clientSla, priority){
  if(!tier || tier === "Χωρίς σύμβαση") return null;
  const m = SLA_M[priority] || SLA_M["P3 Κανονικό"];
  const cap = +clientSla > 0 ? +clientSla * 60 : (CFG.tierSla?.[tier] || 0) * 60;
  return { response: cap > 0 ? Math.min(m.response, cap) : m.response, resolve: m.resolve };
}
function dueDates(createdIso, tier, clientSla, priority){
  const tg = slaTargets(tier, clientSla, priority);
  if(!tg) return { due:"", resolveDue:"" };
  return { due: addBusiness(createdIso, tg.response), resolveDue: addBusiness(createdIso, tg.resolve) };
}
function slaState(t){
  if(t.status === "Κλειστό" || t.status === "Επιλύθηκε"){
    if(!t.resolveDue) return null;
    const late = t.resolved && new Date(t.resolved) > new Date(t.resolveDue);
    return { cls: late ? "bad" : "met", label: late ? "Επιλύθηκε εκτός SLA" : "Επιλύθηκε εντός SLA", pct: 100, final:true };
  }
  const phase = !t.firstResp ? "response" : "resolve";
  const due = phase === "response" ? t.due : t.resolveDue;
  if(!due) return null;
  const total = businessBetween(t.created, due) || 1;
  const used = businessBetween(t.created, nowIso());
  const pct = Math.min(100, Math.round(used / total * 100));
  const left = total - used;
  const what = phase === "response" ? "απόκριση" : "επίλυση";
  if(new Date(due) < new Date()) return { cls:"bad", label:`${what}: έληξε πριν ${fmtMin(businessBetween(due, nowIso()))}`, pct:100, breach:true };
  return { cls: pct >= 75 ? "warn" : "", label:`${what}: σε ${fmtMin(left)}`, pct, risk: pct >= 75 };
}

/* ================= formatting ================= */
function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return "μόλις τώρα"; if(m < 60) return `πριν ${m} λεπτά`;
  const h = Math.round(m/60); if(h < 24) return h === 1 ? "πριν 1 ώρα" : `πριν ${h} ώρες`;
  const d = Math.round(h/24); if(d < 30) return d === 1 ? "χθες" : `πριν ${d} ημέρες`;
  return new Date(iso).toLocaleDateString("el-GR");
}
const fmt = iso => iso ? new Date(iso).toLocaleString("el-GR",{timeZone:"Europe/Athens",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";

const SCOPES = ["User.Read","Sites.ReadWrite.All"];
let msalApp = null, account = null, siteId = null;
async function initAuth(){
  msalApp = new window.msal.PublicClientApplication({
    auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/" + CFG.tenantId, redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:"localStorage" } });
  await msalApp.initialize();
  const r = await msalApp.handleRedirectPromise();
  account = r?.account || msalApp.getAllAccounts()[0] || null;
  if(account) msalApp.setActiveAccount(account);
}
async function token(scopes = SCOPES){
  try { return (await msalApp.acquireTokenSilent({ scopes, account })).accessToken; }
  catch(e){ await msalApp.acquireTokenRedirect({ scopes, account }); throw new Error("redirect"); }
}
async function g(path, opts = {}){
  const url = path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path;
  const r = await fetch(url, { ...opts, headers:{ Authorization:"Bearer " + await token(), "Content-Type":"application/json",
    Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly", ...(opts.headers || {}) } });
  if(!r.ok){ let m = String(r.status); try { m = (await r.json()).error.message; } catch(_){} const e = new Error(m); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function allItems(list, query = ""){
  let url = `/sites/${siteId}/lists/${list}/items?expand=fields&$top=500${query}`, out = [];
  while(url){ const d = await g(url); out = out.concat(d.value); url = d["@odata.nextLink"]; }
  return out;
}
const Graph = {
  async start(){
    await initAuth();
    if(!account) return "login";
    S.me = { name: account.name || account.username, email: (account.username || "").toLowerCase() };
    siteId = (await g(`/sites/${CFG.siteHost}:${CFG.sitePath}`)).id;
    return "ok";
  },
  login(){ return msalApp.loginRedirect({ scopes:SCOPES }); },
  logout(){ return msalApp.logoutRedirect({ account }); },
  async load(){ const [t, c] = await Promise.all([allItems("Tickets"), allItems("TicketClients")]); S.tickets = t.map(fromTicket); S.clients = c.map(fromClient); },
  async comments(id){ return (await allItems("TicketComments", `&$filter=fields/TicketRef eq ${id}`)).map(fromComment); },
  async createTicket(obj){
    const it = await g(`/sites/${siteId}/lists/Tickets/items`, { method:"POST", body:JSON.stringify({ fields: toFields(obj, T_MAP) }) });
    await g(`/sites/${siteId}/lists/Tickets/items/${it.id}/fields`, { method:"PATCH", body:JSON.stringify({ TicketNo: ticketNo(it.id) }) });
    it.fields.TicketNo = ticketNo(it.id); return fromTicket(it);
  },
  async updateTicket(id, obj){ await g(`/sites/${siteId}/lists/Tickets/items/${id}/fields`, { method:"PATCH", body:JSON.stringify(toFields(obj, T_MAP)) }); },
  async addComment(c){
    const it = await g(`/sites/${siteId}/lists/TicketComments/items`, { method:"POST", body:JSON.stringify({ fields:{
      Title:c.body.slice(0,80), TicketRef:c.ref, Body:c.body, Direction:c.dir, AuthorName:c.author, Sent:false } }) });
    return fromComment(it);
  },
  async saveClient(obj){
    const f = toFields(obj, C_MAP); if(f.SLAHours != null) f.SLAHours = +f.SLAHours;
    if(obj.id){ await g(`/sites/${siteId}/lists/TicketClients/items/${obj.id}/fields`, { method:"PATCH", body:JSON.stringify(f) }); return obj; }
    return fromClient(await g(`/sites/${siteId}/lists/TicketClients/items`, { method:"POST", body:JSON.stringify({ fields:f }) }));
  },
  async deleteClient(id){ await g(`/sites/${siteId}/lists/TicketClients/items/${id}`, { method:"DELETE" }); }
};

      </section>

function miniRow(t){
  return `<button class="trow" data-id="${t.id}" style="grid-template-columns:minmax(0,1fr) 170px;padding:10px 4px">
    <span><span class="ttl" style="display:block">${esc(t.title)}</span><span class="tsub">${esc(t.no)}, ${esc(t.client || "χωρίς πελάτη")}</span></span>
    <span class="c-sla">${slaHtml(t)}</span></button>`;
}
function trendChart(){
  const days = [...Array(14)].map((_,i) => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - 13 + i); return d; });
  const key = d => d.toDateString();
  const created = days.map(d => S.tickets.filter(t => t.created && new Date(t.created).toDateString() === key(d)).length);
  const solved = days.map(d => S.tickets.filter(t => t.resolved && new Date(t.resolved).toDateString() === key(d)).length);
  const max = Math.max(2, ...created, ...solved), W = 560, H = 150, pad = 22, bw = (W - pad) / 14;
  const y = v => H - 18 - (v / max) * (H - 30);
  let bars = "";
  days.forEach((d,i) => {
    const x = pad + i*bw;
    bars += `<rect x="${x+bw*0.14}" y="${y(created[i])}" width="${bw*0.34}" height="${H-18-y(created[i])}" rx="2" fill="var(--accent)"><title>${d.toLocaleDateString("el-GR")}: ${created[i]} νέα</title></rect>`;
    bars += `<rect x="${x+bw*0.52}" y="${y(solved[i])}" width="${bw*0.34}" height="${H-18-y(solved[i])}" rx="2" fill="var(--done)"><title>${d.toLocaleDateString("el-GR")}: ${solved[i]} επιλυμένα</title></rect>`;
    if(i % 2 === 0) bars += `<text x="${x+bw/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="var(--dim)">${d.getDate()}/${d.getMonth()+1}</text>`;
  });
  const grid = [0, Math.round(max/2), max].map(v => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Νέα και επιλυμένα tickets ανά ημέρα">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Νέα</span><span><i style="background:var(--done)"></i>Επιλυμένα</span></div>`;
}

function bindProps(){
  const t = S.open;

  };
  $("#p-tech").onchange = e => { const v = e.target.value; const p = { tech:v }; if(v && t.status === "Νέο") Object.assign(p, statusPatch(t, "Ανατέθηκε")); changeTicket(p, `Ανάθεση: ${techName(v)}`); };

    const p = MATRIX[impact][urgency];

    changeTicket(patch, `Επίπτωση ${impact}, επείγον ${urgency}, προτεραιότητα ${p}`);
  };
  $("#p-impact").onchange = e => reprio(e.target.value, t.urgency);
  $("#p-urgency").onchange = e => reprio(t.impact, e.target.value);
  $("#p-prio").onchange = e => {

      <button class="btn" id="p-reason-ok">Αλλαγή σε ${esc(v.slice(0,2))}</button><button class="btn quiet" id="p-reason-x">Άκυρο</button></div>`;
    $("#p-reason").focus();
    $("#p-reason-x").onclick = () => { e.target.value = t.priority; $("#prioReasonBox").innerHTML = ""; };
    $("#p-reason-ok").onclick = () => { const r = $("#p-reason").value.trim(); if(!r) return toast("Η αιτιολόγηση χρειάζεται για να αλλάξει η προτεραιότητα.", true);
      changeTicket({ priority:v, prioReason:r, ...slaPatch(t, v) }, `Προτεραιότητα: ${t.priority} → ${v} (${r})`); };
  };

function slaPatch(t, priority){
  const c = clientOf(t);
  const dd = dueDates(t.created, t.tier, c?.sla, priority);
  const p = { resolveDue: dd.resolveDue, resolveAlerted:false };
  if(!t.firstResp){ p.due = dd.due; p.slaAlerted = false; }
  return p;
}
function statusPatch(t, status){
  const p = { status, last:nowIso() };
  if(!["Νέο","Ανατέθηκε"].includes(status) && !t.firstResp) p.firstResp = nowIso();
  if(status === "Επιλύθηκε" && !t.resolved) p.resolved = nowIso();
  if(OPEN.includes(status)) p.resolved = "";
  return p;
}
async function logEvent(text){ const c = await guard(() => API.addComment({ ref:S.open.id, body:text, dir:DIR.SYS, author:S.me.name })); if(c && S.comments) S.comments.push(c); }
async function changeTicket(patch, logText){
  const t = S.open;
  const ok = await guard(async () => { await API.updateTicket(t.id, { ...patch, last:patch.last || nowIso() }); return true; });
  if(!ok){ render(); return; }
  Object.keys(patch).forEach(k => t[k] = patch[k] === "" ? null : patch[k]);
  t.last = nowIso();
  if(logText) await logEvent(logText);
  render(); toast("Αποθηκεύτηκε");
}
async function reopen(){ await changeTicket({ status:"Σε εξέλιξη", resolved:"", last:nowIso() }, "Επανάνοιγμα ticket"); }
async function sendComment(){
  const t = S.open, body = $("#cbody").value.trim(), after = $("#after").value;
  if(!body) return toast(pendingResolve ? "Γράψε σύντομα τι έγινε για να επιλυθεί." : "Γράψε πρώτα το κείμενο.", true);
  if(replyMode === DIR.OUT && !t.reqEmail) return toast("Το ticket δεν έχει email πελάτη. Αποθήκευσέ το ως εσωτερική σημείωση.", true);
  $("#sendBtn").disabled = true;
  const c = await guard(() => API.addComment({ ref:t.id, body, dir:replyMode, author:S.me.name }));
  if(!c){ $("#sendBtn").disabled = false; return; }
  S.comments.push(c);
  let patch = { last:nowIso() }, log = "";
  if(after && after !== t.status){ patch = statusPatch(t, after); log = `Κατάσταση: ${t.status} → ${after}`; }
  else if(replyMode === DIR.OUT && ["Νέο","Ανατέθηκε"].includes(t.status)){ patch = statusPatch(t, "Σε εξέλιξη"); log = `Κατάσταση: ${t.status} → Σε εξέλιξη`; }
  else if(replyMode === DIR.OUT && !t.firstResp) patch.firstResp = nowIso();
  pendingResolve = false;
  await changeTicket(patch, log);
  toast(replyMode === DIR.OUT ? "Η απάντηση θα σταλεί σε λίγα δευτερόλεπτα" : "Η σημείωση αποθηκεύτηκε");
}

/* ================= modal ================= */
function modal(title, html, onSave, extra){
  $("#layer").innerHTML = `<div class="overlay" id="mov"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header id="mt">${esc(title)}</header>
    <form id="mform">${html}<div class="acts">${extra || ""}<span class="sp"></span><button type="button" class="btn quiet" id="mcancel">Άκυρο</button><button class="btn" id="msave">Αποθήκευση</button></div></form></div>`;
  const close = () => { $("#layer").innerHTML = ""; };
  $("#mov").onclick = close; $("#mcancel").onclick = close;
  $("#mform").onsubmit = async e => { e.preventDefault(); $("#msave").disabled = true; const fd = Object.fromEntries(new FormData(e.target)); if(await onSave(fd) !== false) close(); else $("#msave").disabled = false; };
  setTimeout(() => $("#mform input, #mform select")?.focus(), 30);
  return close;
}
function newTicket(){
  const clientOpts = [["","Επίλεξε πελάτη"], ...S.clients.slice().sort((a,b) => a.name.localeCompare(b.name,"el")).map(c => [String(c.id), c.name])];
  modal("Νέο ticket", `
    <label>Πελάτης<select class="field" name="clientId">${opt(clientOpts,"")}</select></label>
    <div class="grid2"><label>Όνομα αιτούντος<input class="field" name="reqName"></label><label>Email αιτούντος<input class="field" name="reqEmail" type="email"></label></div>
    <label>Θέμα<input class="field" name="title" required></label>
    <label>Περιγραφή<textarea class="field" name="desc" rows="4"></textarea></label>
    <div class="grid2">
      <label>Τύπος<select class="field" name="type">${opt(TYPES,"Περιστατικό")}</select></label>
      <label>Κατηγορία<select class="field" name="category">${opt(CATEGORIES,"Άλλο")}</select></label>
      <label>Επίπτωση<select class="field" name="impact" id="n-imp">${LEVELS.map(l => `<option value="${l}"${l === "Μεσαία" ? " selected" : ""}>${l}: ${IMPACT_HINT[l]}</option>`).join("")}</select></label>
      <label>Επείγον<select class="field" name="urgency" id="n-urg">${LEVELS.map(l => `<option value="${l}"${l === "Μεσαία" ? " selected" : ""}>${l}: ${URGENCY_HINT[l]}</option>`).join("")}</select></label>
      <label>Πηγή<select class="field" name="source">${opt(SOURCES,"Τηλέφωνο")}</select></label>
      <label>Τεχνικός<select class="field" name="tech">${opt([["","Χωρίς ανάθεση"], ...TECHS.map(x => [x.email, x.name])], S.me.email)}</select></label>
    </div>
    <div class="computed" id="n-prio"></div>`,
    async fd => {
      const c = S.clients.find(x => String(x.id) === fd.clientId);
      const priority = MATRIX[fd.impact][fd.urgency], created = nowIso(), tier = c ? c.tier : "Χωρίς σύμβαση";
      const dd = dueDates(created, tier, c?.sla, priority);
      const tech = fd.tech || (c && c.tech) || "";
      const obj = { title:fd.title, desc:fd.desc, type:fd.type, category:fd.category, impact:fd.impact, urgency:fd.urgency, priority,
        source:fd.source, tech, reqName:fd.reqName, reqEmail:fd.reqEmail, client:c ? c.name : "", tier,
        status: tech ? "Ανατέθηκε" : "Νέο", due:dd.due, resolveDue:dd.resolveDue, last:created, slaAlerted:false, resolveAlerted:false };
      const t = await guard(() => API.createTicket(obj));
      if(!t) return false;
      if(!t.created) t.created = created;
      S.tickets.unshift(t);
      await guard(() => API.addComment({ ref:t.id, body:`Δημιουργήθηκε από ${S.me.name} (${fd.source})`, dir:DIR.SYS, author:S.me.name }));
      toast(`Δημιουργήθηκε το ${t.no}`); openTicket(t.id);
    });
  const upd = () => { const p = MATRIX[$("#n-imp").value][$("#n-urg").value]; $("#n-prio").textContent = `Προτεραιότητα: ${p}. Αλλάζει αργότερα από το ticket, με αιτιολόγηση.`; };
  $("#n-imp").onchange = upd; $("#n-urg").onchange = upd; upd();
}

/* ================= clients ================= */
function renderClients(m){
  const q = S.q.trim().toLowerCase();
  const rows = S.clients.filter(c => !q || (c.name + " " + c.domain).toLowerCase().includes(q)).sort((a,b) => a.name.localeCompare(b.name,"el"));
  const openCnt = n => S.tickets.filter(t => t.client === n && OPEN.includes(t.status)).length;
  m.innerHTML = `${mtop()}${demoBanner()}
  <div class="page-head"><h1>Πελάτες</h1><div class="sp"></div>
    <input class="field search" id="q" type="search" placeholder="Αναζήτηση πελάτη ή domain" value="${esc(S.q)}" aria-label="Αναζήτηση">
    <button class="btn" id="addCl">${ICON.plus}Νέος πελάτης</button></div>
  <p style="color:var(--dim);margin:-8px 0 16px;font-size:14px;max-width:70ch">Τα email που έρχονται από το domain ενός πελάτη συνδέονται αυτόματα μαζί του και παίρνουν το SLA του πακέτου του.</p>
  <div class="table">
    <div class="trow thead" style="grid-template-columns:minmax(0,1fr) 140px 120px 90px"><span>Πελάτης</span><span>Πακέτο</span><span class="c-type">Τηλέφωνο</span><span>Ανοιχτά</span></div>
    ${rows.length ? rows.map(c => `<button class="trow" data-cid="${c.id}" style="grid-template-columns:minmax(0,1fr) 140px 120px 90px">
      <span style="min-width:0"><span class="ttl" style="display:block">${esc(c.name)}</span><span class="tsub">${esc(c.domain || "χωρίς domain")}</span></span>
      <span class="tsub">${esc(c.tier)}${+c.sla ? `, ${esc(c.sla)}ω` : ""}</span><span class="tsub c-type">${esc(c.phone || "—")}</span><span class="tsub">${openCnt(c.name)}</span></button>`).join("")
      : `<div class="empty">${S.q ? "Κανένας πελάτης δεν ταιριάζει." : "Πρόσθεσε τον πρώτο σου πελάτη για να αντιστοιχίζονται αυτόματα τα email του."}</div>`}
  </div>`;
  const qi = $("#q"); qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; renderClients(m); const n = $("#q"); n.focus(); n.setSelectionRange(p,p); };
  $("#addCl").onclick = () => editClient();
  m.querySelectorAll("[data-cid]").forEach(b => b.onclick = () => editClient(S.clients.find(c => c.id === +b.dataset.cid)));
  m.querySelectorAll('[data-act="refresh"]').forEach(b => b.onclick = refresh);
}
function editClient(c){
  c = c || { name:"", domain:"", tier:"Business", sla:CFG.tierSla?.Business ?? 4, tech:TECHS[0]?.email || "", phone:"", notes:"" };
  const close = modal(c.id ? "Στοιχεία πελάτη" : "Νέος πελάτης", `
    <label>Επωνυμία<input class="field" name="name" required value="${esc(c.name)}"></label>
    <label>Domain email, πολλά χωρισμένα με ;<input class="field" name="domain" placeholder="example.gr; example.com" value="${esc(c.domain)}"></label>
    <div class="grid2"><label>Πακέτο<select class="field" name="tier" id="tierSel">${opt(TIERS, c.tier)}</select></label>
    <label>Μέγιστη πρώτη απόκριση, εργάσιμες ώρες<input class="field" name="sla" id="slaIn" type="number" min="0" step="0.5" value="${esc(c.sla)}"></label>
    <label>Τεχνικός<select class="field" name="tech">${opt([["","Χωρίς"], ...TECHS.map(x => [x.email, x.name])], c.tech)}</select></label>
    <label>Τηλέφωνο<input class="field" name="phone" value="${esc(c.phone)}"></label></div>
    <label>Σημειώσεις<textarea class="field" name="notes" rows="3">${esc(c.notes)}</textarea></label>`,
    async fd => {
      const obj = { ...fd, domain:fd.domain.toLowerCase().replace(/\s+/g,""), sla:fd.sla === "" ? 0 : +fd.sla };
      if(c.id) obj.id = c.id;
      const r = await guard(() => API.saveClient(obj)); if(!r) return false;
      if(c.id) Object.assign(c, obj); else S.clients.push(r);
      render(); toast("Αποθηκεύτηκε");
    }, c.id ? `<button type="button" class="btn danger" id="delCl">Διαγραφή</button>` : "");
  $("#tierSel").onchange = e => { const v = CFG.tierSla?.[e.target.value]; if(v != null) $("#slaIn").value = v; };
  if(c.id) $("#delCl").onclick = () => {
    const b = $("#delCl");
    if(b.dataset.armed){ guard(async () => { await API.deleteClient(c.id); return true; }).then(ok => { if(ok){ S.clients = S.clients.filter(x => x.id !== c.id); close(); render(); toast("Ο πελάτης διαγράφηκε"); } }); }
    else { b.dataset.armed = "1"; b.textContent = "Πάτα ξανά για διαγραφή"; }
  };
}

/* ================= boot ================= */
async function refresh(){ await guard(() => API.load()); if(S.open){ S.open = S.tickets.find(t => t.id === S.open.id) || null; if(S.open){ openTicket(S.open.id, false); return; } } render(); toast("Ενημερώθηκε"); }
function route(){
  const h = location.hash;
  const m = h.match(/^#t(\d+)$/);
  if(m && S.tickets.some(t => t.id === +m[1])){ openTicket(+m[1], false); return; }
  S.open = null; S.view = ["dash","tickets","clients"].includes(h.slice(1)) ? h.slice(1) : "dash"; render();
}
function gate(inner){ $("#root").innerHTML = `<div class="gate"><div class="card"><div class="logo">PRAXIS TICKETS</div>${inner}</div></div>`; }
async function boot(){
  const st = await guard(() => API.start());
  if(st === "login"){ gate(`<p>Συνδέσου με τον λογαριασμό Microsoft 365 της PRAXIS IT.</p><button class="btn" id="loginBtn">Σύνδεση με Microsoft</button>`); $("#loginBtn").onclick = () => API.login(); return; }
  if(st !== "ok"){ gate(`<p>Δεν ήταν δυνατή η σύνδεση με το SharePoint. Έλεγξε τη σύνδεση στο internet και δοκίμασε ξανά.</p><button class="btn" onclick="location.reload()">Δοκιμή ξανά</button>`); return; }
  await guard(() => API.load());
  renderShell(); route();
}
window.addEventListener("popstate", route);
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#mov")) $("#mov").click(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.me.name && !DEMO && S.view !== "ticket" && !$("#mov")) API.load().then(render).catch(() => {}); });
setInterval(() => { if(document.visibilityState === "visible" && S.me.name && !DEMO && S.view !== "ticket" && !$("#mov")) API.load().then(render).catch(() => {}); }, 120000);
boot();
</script>
