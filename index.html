<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRAXIS Tickets</title>
<meta name="theme-color" content="#14305C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PRAXIS Tickets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<style>
:root{
  --side:#FFFFFF; --side-ink:#14305C; --side-dim:#607085; --side-logo:#14305C; --side-logo-b:#0E91DD;
  --side-hover:#F1F6FC; --side-on:#E3F1FC; --side-line:#E3EAF3; --side-chip:#E3F1FC;
  --navy:#14305C; --orange:#F97316; --cta:#0E91DD; --cta-ink:#fff;
  --primary:#0E91DD; --primary-ink:#fff; --accent:#38AEF0;
  --bg:#F9FAFB; --surface:#FFFFFF; --sunken:#F3F7FB; --line:#DCE8F7; --line-strong:#CDE0F9;
  --text:#1F2937; --dim:#607085; --faint:#97A3B4;
  --ok:#0E91DD; --warn:#EA580C; --bad:#DC2828; --done:#16A34A;
  --focus:0 0 0 3px rgba(14,145,221,.4);
}
:root[data-theme="dark"]{
  --side:#0A1628; --side-ink:#DCE7F5; --side-dim:#7F8FA8; --side-logo:#fff; --side-logo-b:#38AEF0;
  --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.1); --side-line:rgba(255,255,255,.1); --side-chip:rgba(255,255,255,.14);
  --navy:#0A1628; --orange:#FB923C; --cta:#38AEF0; --cta-ink:#06223A;
  --primary:#38AEF0; --primary-ink:#06223A; --accent:#7CCBF7;
  --bg:#0E1A2E; --surface:#15243D; --sunken:#112038; --line:#22385A; --line-strong:#2C4670;
  --text:#E6EEF8; --dim:#9AABC4; --faint:#62759A;
  --ok:#38AEF0; --warn:#FB923C; --bad:#F87171; --done:#4ADE80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside.side{background:var(--side);border-right:1px solid var(--side-line);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-family:Inter,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;padding:0 10px 22px;color:var(--side-logo)}
.logo b{font-weight:800;color:var(--side-logo-b)}
.logo span{display:block;font-family:Inter;letter-spacing:0;font-size:12px;letter-spacing:.2px;color:var(--side-dim);font-weight:500;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-ink);padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button svg{flex:none;color:var(--orange)}
.side-foot button svg{color:var(--orange)}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-on);color:var(--side-ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;font-size:12px;background:var(--side-chip);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--side-line)}
.side-foot button{border:0;background:none;color:var(--side-dim);text-align:left;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:14px}
.side-foot button:hover{color:var(--side-ink);background:var(--side-hover)}
.who{padding:8px 12px;font-size:13px;color:var(--side-dim)}
.who b{display:block;color:var(--side-ink);font-weight:600}

main{min-width:0;padding:28px 36px 60px}
.page-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.2px}
.page-head .sp{flex:1}
.demo{background:#FEF3C7;color:#7C4A03;font-size:13px;padding:8px 14px;border-radius:8px;margin-bottom:18px}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--primary);border:1px solid var(--line-strong)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line-strong)}
.btn.newbtn,.btn.cta{background:var(--cta);color:var(--cta-ink)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--orange)}
.icon-btn:hover{color:var(--primary)}
input.field,select.field,textarea.field{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%}
.search{max-width:320px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:22px}
.kpi{padding:18px 22px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .n{font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--dim);margin-top:6px}
.kpi.bad .n{color:var(--bad)}
.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:700}
.panel h2 small{font-weight:400;color:var(--dim);margin-left:6px;font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--primary);border-radius:4px}
.hbar .v{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.stack{display:flex;flex-direction:column;gap:22px}

/* ---------- ticket table ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--dim)}
.filters button.on{background:var(--side-ink);border-color:var(--side-ink);color:var(--surface)}
.filters button em{font-style:normal;opacity:.7;margin-left:4px}
.table{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 128px 130px 130px 150px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.trow:first-child{border-top:0}
button.trow:hover{background:var(--sunken)}
.thead{font-size:12px;color:var(--dim);font-weight:600;background:var(--sunken)}
.tno{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;font-weight:600}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prio{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.prio i{width:8px;height:8px;border-radius:50%}
.status{font-size:13px;font-weight:600}
.st-new{color:var(--accent)} .st-open{color:var(--primary)} .st-wait{color:var(--warn)} .st-done{color:var(--done)} .st-closed{color:var(--faint)}
.sla{display:block;font-size:12px;color:var(--dim)}
.sla .bar{display:block;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.sla .bar i{display:block;height:100%;background:var(--ok)}
.sla.warn{color:var(--warn)} .sla.warn .bar i{background:var(--warn)}
.sla.bad{color:var(--bad)} .sla.bad .bar i{background:var(--bad)}
.sla.met{color:var(--done)}
.empty{padding:48px 20px;text-align:center;color:var(--dim)}
.empty .btn{margin-top:14px}

/* ---------- ticket detail ---------- */
.back{border:0;background:none;color:var(--dim);padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.back:hover{color:var(--primary)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.dhead h1{font-size:22px;margin:4px 0 6px;line-height:1.3;overflow-wrap:anywhere}
.dhead .meta{font-size:13px;color:var(--dim)}
.timeline{margin-top:18px;display:flex;flex-direction:column}
.ev{position:relative;padding:0 0 18px 26px}
.ev::before{content:"";position:absolute;left:7px;top:22px;bottom:0;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .dot{position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.ev.in .dot{border-color:var(--accent)}
.ev.out .dot{background:var(--primary);border-color:var(--primary)}
.ev.note .dot{border-color:var(--warn);border-style:dashed}
.ev.sys .dot{width:10px;height:10px;left:3px;top:8px;background:var(--line-strong);border:0}
.ev .who2{font-size:13px;color:var(--dim)}
.ev .who2 b{color:var(--text)}
.ev .msg{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ev.out .msg{border-color:var(--primary)}
.ev.note .msg{background:var(--sunken);border-style:dashed}
.ev.sys{padding-bottom:12px}
.ev.sys .who2{font-size:13px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--side-ink);color:var(--surface)}
.composer textarea{border:0;background:transparent;width:100%;resize:vertical;min-height:80px;padding:4px 2px}
.composer textarea:focus{box-shadow:none}
.crow{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.crow select{max-width:230px}
.props{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 16px;position:sticky;top:20px}
.prop{padding:11px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop label,.prop .k{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:600}
.prop .v{font-size:14px;overflow-wrap:anywhere}
.prop .v a{color:var(--primary)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.computed{font-size:12px;color:var(--dim);margin-top:6px}
.inline-warn{font-size:13px;color:var(--warn);margin-top:6px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,22,40,.45);z-index:50}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border-radius:14px;z-index:51;box-shadow:0 24px 64px rgba(10,22,40,.35)}
.modal header{padding:18px 22px 4px;font-weight:700;font-size:18px}
.modal form{padding:10px 22px 22px;display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim);font-weight:600}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.modal .acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90%}
.toast.err{background:var(--bad);color:#fff}

/* ---------- login ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}
.gate .card{background:var(--surface);border-radius:16px;padding:36px 32px;max-width:400px;width:100%}
.gate .logo{color:var(--text);padding:0 0 10px;font-size:34px}
.gate .logo b,.mtop .logo b{color:var(--primary)}
.gate .logo span{font-size:14px;color:var(--dim)}
.gate p{color:var(--dim);margin:0 0 22px}
.gate .btn{background:var(--cta);color:var(--cta-ink);width:100%;justify-content:center;padding:12px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside.side{display:none}
  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .mtop{display:flex!important}
  .page-head{margin-bottom:14px}
  .page-head h1{font-size:20px}
  .page-head .newbtn{display:none}
  .search{max-width:none;order:3;flex-basis:100%}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:14px 16px}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .kpi .n{font-size:36px}
  .dash{grid-template-columns:1fr}
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
  .trow .c-no{display:none}
  .trow .c-type{display:none}
  .trow .c-prio{grid-column:2;grid-row:1;justify-self:end}
  .trow .c-status{grid-column:2;grid-row:2;justify-self:end}
  .trow .c-sla{grid-column:1 / span 2}
  .detail{grid-template-columns:1fr}
  .props{position:static}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:6px 0}
  .tabbar button svg{color:var(--orange)}
  .tabbar button.on{color:var(--primary);font-weight:600}
  .tabbar .plus{color:var(--cta-ink)}
  .tabbar .plus svg{color:var(--cta-ink)}
  .tabbar .plus span{width:44px;height:44px;border-radius:12px;background:var(--cta);display:grid;place-items:center;margin-top:-2px}
  .modal .grid2{grid-template-columns:1fr}
}
/* ---------- time tracking ---------- */
.muted{color:var(--dim);margin:0;font-size:14px}
.tpanel{margin-top:18px}
.tp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tp-head h2{margin:0}
.tp-head .sp{flex:1}
.tp-head .btn{padding:7px 12px;font-size:14px}
.btn.stop{background:var(--bad);color:#fff}
.btn b,.tchip b{font-variant-numeric:tabular-nums;font-weight:700}
.rec{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.tlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tentry{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit;width:100%}
.tentry:hover{background:var(--sunken)}
.tentry .d{font-size:13px;font-variant-numeric:tabular-nums}
.tentry small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.tentry .n{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.tentry .h{font-weight:700;font-variant-numeric:tabular-nums}
.tchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--bad);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;margin:0 0 10px}
.tchip b{color:var(--text);margin-left:auto}
.mtop .tchip{margin:0;padding:6px 9px}
.modal .grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.modal label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-weight:500}
.modal label.check input{width:18px;height:18px;accent-color:var(--primary)}
.tm-ticket{font-weight:600;font-size:14px}
.modal .durrow{align-items:end}
.modal .durrow .computed{margin:0 0 10px}
.tm-ticket span{font-weight:400;color:var(--dim);font-size:13px}
/* ---------- reports ---------- */
.rp-controls{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.rp-controls .filters{margin:0}
.rp-row{display:grid;grid-template-columns:150px 150px minmax(0,260px) minmax(0,220px);gap:12px}
.rp-row label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);font-weight:600}
.rp-dash{grid-template-columns:1.3fr 1fr;margin-bottom:22px}
.rp-sec{margin-bottom:22px}
.rbar .b{position:relative}
.rbar .b u{position:absolute;left:0;top:0;bottom:0;background:var(--orange);border-radius:4px}
.rbar .v{width:auto}
.hbar.rbar{grid-template-columns:minmax(90px,170px) 1fr 52px}
.rt-wrap{overflow-x:auto;margin:0 -4px}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;font-size:12px;color:var(--dim);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.rt td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rt td small{color:var(--dim);font-size:12px}
.rt tbody tr{cursor:pointer}
.rt tbody tr:hover{background:var(--sunken)}
.rt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .nowrap{white-space:nowrap}
.rt tfoot td{border-bottom:0;border-top:2px solid var(--line-strong);font-weight:600}
.print-head,.print-foot{display:none}
.ph-sub{display:block;font-size:14px;font-weight:500;color:var(--dim);margin-top:2px;letter-spacing:0}
.portal-note{color:var(--dim);font-size:14px;margin:-10px 0 16px}
a.btn{text-decoration:none}
.portal-reply .btn{display:inline-flex}
.portal-hint{margin:2px 2px 8px;color:var(--dim);font-size:14px}
.pending-row{opacity:.75}
.attach{cursor:pointer;position:relative}
.attach svg{color:var(--orange)}
.attach.busy{opacity:.6;pointer-events:none}
.attach.busy::after{content:"…"}
.flist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fitem{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;align-items:center}
.fitem:hover{background:var(--sunken)}
.fitem svg{color:var(--orange);grid-row:1 / span 2}
.fitem .fn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}
.fitem .fm{font-size:12px;color:var(--dim);grid-column:2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--sunken);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;max-width:100%}
.chip svg{color:var(--orange);flex:none}
.chip small{color:var(--dim)}
.chip button{border:0;background:none;color:var(--dim);font-size:16px;line-height:1;padding:2px 6px;border-radius:999px}
.chip button:hover{color:var(--bad)}
.portal-reply .crow{justify-content:flex-start}
.modal .acts{flex-wrap:wrap;align-items:center}
.mlink{color:var(--primary);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ev .who2 .pend{color:var(--warn)}
.pf-users{font-size:12px;color:var(--dim);margin-top:4px}
.trow.prow{grid-template-columns:96px minmax(0,1fr) 200px 140px}
@media (max-width:860px){.trow.prow{grid-template-columns:minmax(0,1fr) auto}.trow.prow .c-status{text-align:right;max-width:150px}}
.icon-btn[data-act="lang"]{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--side-ink)}
.lang-ic{display:inline-grid;place-items:center;width:20px;height:17px;border:1.5px solid var(--orange);border-radius:4px;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:.2px}
.gate .lang-row{margin-top:16px;text-align:center}
.gate .lang-row button{border:0;background:none;color:var(--dim);font-size:13px;display:inline-flex;align-items:center;gap:8px}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#111!important}
  aside.side,.tabbar,.mtop,.page-head,.rp-controls,.demo,.toast,#layer{display:none!important}
  .shell{display:block}
  main{padding:0}
  .print-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid #14305C;padding-bottom:10px;margin-bottom:16px;font-size:13px;text-align:right}
  .print-head .logo{color:#14305C;padding:0;font-size:26px}
  .print-head .logo b{color:#0E91DD}
  .print-foot{display:block;font-size:11px;color:#555;margin-top:12px}
  .panel,.kpis{border-color:#ccc;break-inside:avoid;box-shadow:none}
  .rp-dash{grid-template-columns:1fr 1fr}
  .rt tbody tr:hover{background:none}
  .rt{font-size:12px}
}
.mtop{display:none;align-items:center;gap:10px;margin:-2px 0 14px}
.mtop .logo{color:var(--text);padding:0;font-size:24px}
.mtop .sp{flex:1}
@media (max-width:860px){
  .modal .grid3{grid-template-columns:1fr 1fr}
  .modal .grid3 label:first-child{grid-column:1 / span 2}
  .modal .durrow label:first-child{grid-column:auto}
  .modal .durrow .computed{grid-column:1 / span 2;margin:0}
  .rp-row{grid-template-columns:1fr 1fr}
  .rp-row label{min-width:0}
  .rp-dash{grid-template-columns:1fr}
  .tentry{grid-template-columns:78px minmax(0,1fr) auto}
  .rt{font-size:13px}
}

/* ================= business-hours time (Europe/Athens) ================= */
const TZF = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Athens",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function wall(d){ const p = Object.fromEntries(TZF.formatToParts(d).map(x=>[x.type,x.value])); return new Date(Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second)); }
function unwall(w){ let t = w.getTime(); for(let i=0;i<2;i++){ const off = wall(new Date(t)).getTime() - t; t = w.getTime() - off; } return new Date(t); }
const dayKey = w => w.toISOString().slice(0,10);
const isWorkDay = w => BH.days.includes(w.getUTCDay()) && !HOLI.has(dayKey(w));
const atHour = (w,h) => new Date(Date.UTC(w.getUTCFullYear(), w.getUTCMonth(), w.getUTCDate(), h));
const nextDayStart = w => atHour(new Date(w.getTime() + 86400000), BH.start);
function addBusiness(startUtc, minutes){
  let w = wall(new Date(startUtc)), left = minutes;
  for(let guard=0; guard<400; guard++){
    if(!isWorkDay(w)){ w = nextDayStart(w); continue; }
    const open = atHour(w,BH.start), close = atHour(w,BH.end);
    if(w < open){ w = open; continue; }
    if(w >= close){ w = nextDayStart(w); continue; }
    const avail = (close - w) / 60000;
    if(left <= avail) return unwall(new Date(w.getTime() + left*60000)).toISOString();
    left -= avail; w = nextDayStart(w);
  }
  return null;
}
function businessBetween(aUtc, bUtc){
  let a = wall(new Date(aUtc)), b = wall(new Date(bUtc));
  if(b <= a) return 0;
  let total = 0, d = atHour(a, 0);
  for(let guard=0; guard<400 && d < b; guard++){
    if(isWorkDay(d)){
      const s = Math.max(atHour(d,BH.start), a), e = Math.min(atHour(d,BH.end), b);
      if(e > s) total += (e - s) / 60000;
    }
    d = new Date(d.getTime() + 86400000);
  }
  return total;
}
const fmtMin = m => { m = Math.round(Math.abs(m)); const h = Math.floor(m/60), r = m%60; if(h >= 16) return Math.round(h/8) + T(" εργ. ημ.", " bus. days"); const H = T("ω","h"), M = T("λ","m"); return h ? (r ? `${h}${H} ${r}${M}` : `${h}${H}`) : `${r}${M}`; };

/* ================= SLA ================= */
function clientOf(t){ return S.clients.find(c => c.name === t.client); }
function slaTargets(tier, clientSla, priority){
  if(!tier || tier === "Χωρίς σύμβαση") return null;
  const m = SLA_M[priority] || SLA_M["P3 Κανονικό"];
  const cap = +clientSla > 0 ? +clientSla * 60 : (CFG.tierSla?.[tier] || 0) * 60;
  return { response: cap > 0 ? Math.min(m.response, cap) : m.response, resolve: m.resolve };
}
function dueDates(createdIso, tier, clientSla, priority){
  const tg = slaTargets(tier, clientSla, priority);
  if(!tg) return { due:"", resolveDue:"" };
  return { due: addBusiness(createdIso, tg.response), resolveDue: addBusiness(createdIso, tg.resolve) };
}
function slaState(t){
  if(t.status === "Κλειστό" || t.status === "Επιλύθηκε"){
    if(!t.resolveDue) return null;
    const late = t.resolved && new Date(t.resolved) > new Date(t.resolveDue);
    return { cls: late ? "bad" : "met", label: late ? "Επιλύθηκε εκτός SLA" : "Επιλύθηκε εντός SLA", pct: 100, final:true };
  }
  const phase = !t.firstResp ? "response" : "resolve";
  const due = phase === "response" ? t.due : t.resolveDue;
  if(!due) return null;
  const total = businessBetween(t.created, due) || 1;
  const used = businessBetween(t.created, nowIso());
  const pct = Math.min(100, Math.round(used / total * 100));
  const left = total - used;
  const what = phase === "response" ? T("απόκριση","response") : T("επίλυση","resolution");
  if(new Date(due) < new Date()) return { cls:"bad", label: T(`${what}: έληξε πριν ${fmtMin(businessBetween(due, nowIso()))}`, `${what}: overdue by ${fmtMin(businessBetween(due, nowIso()))}`), pct:100, breach:true };
  return { cls: pct >= 75 ? "warn" : "", label: T(`${what}: σε ${fmtMin(left)}`, `${what}: due in ${fmtMin(left)}`), pct, risk: pct >= 75 };
}

function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(LANG === "en"){ if(m < 1) return "just now"; if(m < 60) return `${m} min ago`; const h = Math.round(m/60); if(h < 24) return h === 1 ? "1 hour ago" : `${h} hours ago`; const d = Math.round(h/24); if(d < 30) return d === 1 ? "yesterday" : `${d} days ago`; return new Date(iso).toLocaleDateString(LOC); }
  if(m < 1) return "μόλις τώρα"; if(m < 60) return `πριν ${m} λεπτά`;
  const h = Math.round(m/60); if(h < 24) return h === 1 ? "πριν 1 ώρα" : `πριν ${h} ώρες`;
  const d = Math.round(h/24); if(d < 30) return d === 1 ? "χθες" : `πριν ${d} ημέρες`;
  return new Date(iso).toLocaleDateString(LOC);
}

    if(!r.ok && r.status !== 202){ const e = new Error(T("Το αρχείο δεν ανέβηκε", "The file did not upload") + ` (${r.status})`); e.status = r.status; throw e; }

function checkFiles(list){
  const files = [...(list || [])];
  if(files.length > MAX_FILES){ toast(T(`Έως ${MAX_FILES} αρχεία κάθε φορά.`, `Up to ${MAX_FILES} files at a time.`), true); return null; }
  const big = files.find(f => f.size > MAX_FILE_MB * 1048576);
  if(big){ toast(T(`Το ${big.name} είναι πάνω από ${MAX_FILE_MB} MB.`, `${big.name} is over ${MAX_FILE_MB} MB.`), true); return null; }
  const empty = files.find(f => !f.size);
  if(empty){ toast(T(`Το ${empty.name} είναι κενό.`, `${empty.name} is empty.`), true); return null; }
  return files;
}

function renderDash(m){
  const open = S.tickets.filter(t => OPEN.includes(t.status));
  const breaches = open.filter(t => slaState(t)?.breach);
  const responded = S.tickets.filter(t => t.firstResp && t.created && new Date(t.created) > Date.now() - 30*864e5);
  const avgResp = responded.length ? responded.reduce((a,t) => a + businessBetween(t.created, t.firstResp), 0) / responded.length : null;
  const solved30 = S.tickets.filter(t => t.resolved && new Date(t.resolved) > Date.now() - 30*864e5);
  const withSla = solved30.filter(t => t.resolveDue);
  const slaPct = withSla.length ? Math.round(withSla.filter(t => new Date(t.resolved) <= new Date(t.resolveDue)).length / withSla.length * 100) : null;
  const attention = open.map(t => ({ t, s:slaState(t) })).filter(x => x.s && (x.s.breach || x.s.risk)).sort((a,b) => b.s.pct - a.s.pct).slice(0,6);
  const unassigned = open.filter(t => !t.tech);

function miniRow(t){
  return `<button class="trow" data-id="${t.id}" style="grid-template-columns:minmax(0,1fr) 170px;padding:10px 4px">
    <span><span class="ttl" style="display:block">${esc(t.title)}</span><span class="tsub">${esc(t.no)}, ${esc(t.client || L("χωρίς πελάτη"))}</span></span>
    <span class="c-sla">${slaHtml(t)}</span></button>`;

function trendChart(){
  const days = [...Array(14)].map((_,i) => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - 13 + i); return d; });
  const key = d => d.toDateString();
  const created = days.map(d => S.tickets.filter(t => t.created && new Date(t.created).toDateString() === key(d)).length);
  const solved = days.map(d => S.tickets.filter(t => t.resolved && new Date(t.resolved).toDateString() === key(d)).length);
  const max = Math.max(2, ...created, ...solved), W = 560, H = 150, pad = 22, bw = (W - pad) / 14;
  const y = v => H - 18 - (v / max) * (H - 30);
  let bars = "";
  days.forEach((d,i) => {
    const x = pad + i*bw;
    bars += `<rect x="${x+bw*0.14}" y="${y(created[i])}" width="${bw*0.34}" height="${H-18-y(created[i])}" rx="2" fill="var(--accent)"><title>${d.toLocaleDateString(LOC)}: ${created[i]} ${T("νέα","new")}</title></rect>`;
    bars += `<rect x="${x+bw*0.52}" y="${y(solved[i])}" width="${bw*0.34}" height="${H-18-y(solved[i])}" rx="2" fill="var(--done)"><title>${d.toLocaleDateString(LOC)}: ${solved[i]} ${T("επιλυμένα","resolved")}</title></rect>`;
    if(i % 2 === 0) bars += `<text x="${x+bw/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="var(--dim)">${d.getDate()}/${d.getMonth()+1}</text>`;
  });
  const grid = [0, Math.round(max/2), max].map(v => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Νέα και επιλυμένα tickets ανά ημέρα">${grid}${bars}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Νέα</span><span><i style="background:var(--done)"></i>Επιλυμένα</span></div>`;
}

      <input class="field" id="p-reason" placeholder="π.χ. ο πελάτης έχει έλεγχο αύριο"><div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" id="p-reason-ok">${T("Αλλαγή σε","Change to")} ${esc(v.slice(0,2))}</button><button class="btn quiet" id="p-reason-x">Άκυρο</button></div>`;
    $("#p-reason").focus();
    $("#p-reason-x").onclick = () => { e.target.value = t.priority; $("#prioReasonBox").innerHTML = ""; };
    $("#p-reason-ok").onclick = () => { const r = $("#p-reason").value.trim(); if(!r) return toast("Η αιτιολόγηση χρειάζεται για να αλλάξει η προτεραιότητα.", true);
      changeTicket({ priority:v, prioReason:r, ...slaPatch(t, v) }, `Προτεραιότητα: ${t.priority} → ${v} (${r})`); };
  };
}
function slaPatch(t, priority){
  const c = clientOf(t);
  const dd = dueDates(t.created, t.tier, c?.sla, priority);
  const p = { resolveDue: dd.resolveDue, resolveAlerted:false };
  if(!t.firstResp){ p.due = dd.due; p.slaAlerted = false; }
  return p;
}
function statusPatch(t, status){
  const p = { status, last:nowIso() };
  if(!["Νέο","Ανατέθηκε"].includes(status) && !t.firstResp) p.firstResp = nowIso();
  if(status === "Επιλύθηκε" && !t.resolved) p.resolved = nowIso();
  if(OPEN.includes(status)) p.resolved = "";
  return p;
}
async function logEvent(text){ const c = await guard(() => API.addComment({ ref:S.open.id, body:text, dir:DIR.SYS, author:S.me.name })); if(c && S.comments) S.comments.push(c); }
async function changeTicket(patch, logText){
  const t = S.open;
  const ok = await guard(async () => { await API.updateTicket(t.id, { ...patch, last:patch.last || nowIso() }); return true; });
  if(!ok){ render(); return; }
  Object.keys(patch).forEach(k => t[k] = patch[k] === "" ? null : patch[k]);
  t.last = nowIso();
  if(logText) await logEvent(logText);
  render(); toast("Αποθηκεύτηκε");
}
async function deleteTicket(t){

async function sendComment(){

/* ================= time tracking ================= */
const WORK_TYPES = ["Απομακρυσμένα","Επί τόπου","Τηλεφωνικά"];
const fmtDur = m => { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; };
const decH = m => (Math.round((m || 0) / 60 * 100) / 100).toLocaleString(LOC, { minimumFractionDigits:2, maximumFractionDigits:2 });
function athensParts(iso){ const w = wall(new Date(iso)).toISOString(); return { date:w.slice(0,10), time:w.slice(11,16) }; }
function fromLocal(date, time){ const [y,m,d] = date.split("-").map(Number), [hh,mm] = (time || "00:00").split(":").map(Number); return unwall(new Date(Date.UTC(y, m-1, d, hh, mm))); }
function addDays(date, n){ const [y,m,d] = date.split("-").map(Number); return new Date(Date.UTC(y, m-1, d + n)).toISOString().slice(0,10); }
const fmtDay = date => { const [y,m,d] = date.split("-"); return `${d}/${m}/${y}`; };
const ticketTime = id => S.time.filter(e => e.ref === id);

/* running timer: kept in this browser only */
const TIMER_KEY = "praxis-timer";
function getTimer(){ try { const v = JSON.parse(localStorage.getItem(TIMER_KEY) || "null"); return v && v.ref && v.start ? v : null; } catch(_){ return null; } }
function setTimer(v){ try { v ? localStorage.setItem(TIMER_KEY, JSON.stringify(v)) : localStorage.removeItem(TIMER_KEY); } catch(_){} }
const elapsed = start => { const s = Math.max(0, Math.floor((Date.now() - new Date(start)) / 1000)); return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
setInterval(() => { const tm = getTimer(); document.querySelectorAll("[data-tick]").forEach(el => el.textContent = tm ? elapsed(tm.start) : ""); }, 1000);
function timerChip(){
  const tm = getTimer(); if(!tm) return "";
  const t = S.tickets.find(x => x.id === tm.ref);
  return `<button class="tchip" data-timer-open="${tm.ref}" title="Άνοιγμα ticket"><span class="rec" aria-hidden="true"></span>${esc(t ? t.no : "Χρονόμετρο")}<b data-tick>${elapsed(tm.start)}</b></button>`;
}
function startTimer(t){
  const cur = getTimer();
  if(cur && cur.ref !== t.id){ const o = S.tickets.find(x => x.id === cur.ref); toast(T(`Τρέχει ήδη χρονόμετρο στο ${o ? o.no : "άλλο ticket"}. Σταμάτησέ το πρώτα.`, `A timer is already running on ${o ? o.no : "another ticket"}. Stop it first.`), true); return; }
  setTimer({ ref:t.id, start:nowIso() }); render(); toast("Το χρονόμετρο ξεκίνησε");
}
function stopTimer(){
  const tm = getTimer(); if(!tm) return;
  const t = S.tickets.find(x => x.id === tm.ref);
  if(!t){ setTimer(null); render(); return; }
  const st = new Date(tm.start); st.setSeconds(0, 0);
  const en = new Date(Math.max(Date.now(), st.getTime() + 60000)); if(en.getSeconds() || en.getMilliseconds()){ en.setSeconds(0, 0); en.setMinutes(en.getMinutes() + 1); }
  timeModal(t, null, { start:st.toISOString(), end:en.toISOString(), fromTimer:true });
}

/* add or edit one entry */
function timeModal(t, e, pre = {}){
  const now = athensParts(nowIso());
  const s = e ? athensParts(e.start) : pre.start ? athensParts(pre.start) : { date:now.date, time:"" };
  const en = e ? athensParts(e.end) : pre.end ? athensParts(pre.end) : { date:now.date, time:"" };
  const cl = clientOf(t);
  const billDef = e ? e.billable : !cl || cl.tier === "Χωρίς σύμβαση";
  const techOpts = TECHS.map(x => [x.email, x.name]); if(!TECHS.some(x => x.email === S.me.email)) techOpts.unshift([S.me.email, S.me.name]);
  const close = modal(e ? "Επεξεργασία χρόνου" : "Καταχώρηση χρόνου", `
    <div class="tm-ticket">${esc(t.no)}, ${esc(t.title)}<br><span>${esc(t.client || L("χωρίς πελάτη"))}</span></div>
    <div class="grid3">

      <label>Ή διάρκεια: ώρες<input class="field" type="number" inputmode="numeric" min="0" max="23" step="1" id="tm-h" placeholder="0"></label>
      <label>λεπτά<input class="field" type="number" inputmode="numeric" min="0" max="59" step="5" id="tm-m" placeholder="0"></label>
      <div class="computed" id="tm-dur" aria-live="polite"></div>
    </div>
    <div class="grid2">
      <label>Τύπος εργασίας<select class="field" name="kind">${opt(WORK_TYPES, e ? e.kind : "Απομακρυσμένα")}</select></label>
      <label>Τεχνικός<select class="field" name="tech">${opt(techOpts, e ? e.tech : S.me.email)}</select></label>
    </div>
    <label>Τι έγινε<textarea class="field" name="note" rows="3" placeholder="Σύντομη περιγραφή της εργασίας, εμφανίζεται στην αναφορά του πελάτη">${esc(e ? e.note : "")}</textarea></label>
    <label class="check"><input type="checkbox" name="billable" ${billDef ? "checked" : ""}> Χρεώνεται επιπλέον (εκτός σύμβασης)</label>`,
    async fd => {
      const r = calc(fd); if(!r) return false;
      const obj = { ref:t.id, no:t.no, client:t.client || "", tech:fd.tech, techName:techName(fd.tech), start:r.start.toISOString(), end:r.end.toISOString(),
        minutes:r.min, note:(fd.note || "").trim(), billable:!!fd.billable, kind:fd.kind };
      if(e){ const ok = await guard(async () => { await API.updateTime(e.id, obj); return true; }); if(!ok) return false; Object.assign(e, obj); }
      else { const x = await guard(() => API.addTime(obj)); if(!x) return false; S.time.push(x); }
      if(pre.fromTimer) setTimer(null);
      render(); toast(e ? L("Αποθηκεύτηκε") : T(`Καταχωρήθηκαν ${fmtDur(r.min)} ώρες`, `Logged ${fmtDur(r.min)} hours`));
    },
    (e ? `<button type="button" class="btn danger" id="tm-del">Διαγραφή</button>` : "") + (pre.fromTimer ? `<button type="button" class="btn quiet" id="tm-discard">Απόρριψη χρονομέτρου</button>` : ""));
  const f = $("#mform");
  function calc(fd){
    if(!fd.date || !fd.from || !fd.to){ toast("Συμπλήρωσε ημερομηνία, από και έως.", true); return null; }
    const start = fromLocal(fd.date, fd.from); let end = fromLocal(fd.date, fd.to);
    if(end < start) end = fromLocal(addDays(fd.date, 1), fd.to);
    const min = Math.round((end - start) / 60000);
    if(min < 1 || min > 24*60){ toast("Η διάρκεια πρέπει να είναι από 1 λεπτό έως 24 ώρες.", true); return null; }
    return { start, end, min };
  }
  const durIn = () => {
    const h = Math.max(0, parseInt($("#tm-h").value || "0", 10) || 0), mi = Math.max(0, parseInt($("#tm-m").value || "0", 10) || 0), tot = h*60 + mi;
    if(!tot) return;
    const F = n => f.querySelector(`[name="${n}"]`);
    if(!F("date").value) F("date").value = athensParts(nowIso()).date;
    let start;
    if(F("from").value) start = fromLocal(F("date").value, F("from").value);
    else { start = new Date(Date.now() - tot*60000); const p = athensParts(start.toISOString()); F("date").value = p.date; F("from").value = p.time; start = fromLocal(p.date, p.time); }
    F("to").value = athensParts(new Date(start.getTime() + tot*60000).toISOString()).time;
    upd(true);
  };
  $("#tm-h").oninput = durIn; $("#tm-m").oninput = durIn;
  const upd = (fromDur) => {
    const fd = Object.fromEntries(new FormData(f)); if(!fd.date || !fd.from || !fd.to){ $("#tm-dur").textContent = ""; return; }
    const start = fromLocal(fd.date, fd.from); let end = fromLocal(fd.date, fd.to); const next = end < start; if(next) end = fromLocal(addDays(fd.date, 1), fd.to);
    const mins = Math.round((end - start) / 60000);
    $("#tm-dur").textContent = T(`Διάρκεια ${fmtDur(mins)} ώρες${next ? ", λήγει την επόμενη ημέρα" : ""}`, `Duration ${fmtDur(mins)} hours${next ? ", ends the next day" : ""}`);
    if(fromDur !== true){ $("#tm-h").value = Math.floor(mins/60); $("#tm-m").value = mins % 60; }
  };
  f.querySelectorAll('input[type="date"],input[type="time"]').forEach(i => i.oninput = () => upd()); upd();
  if(e) $("#tm-del").onclick = () => { const b = $("#tm-del");
    if(b.dataset.armed){ guard(async () => { await API.deleteTime(e.id); return true; }).then(ok => { if(ok){ S.time = S.time.filter(x => x.id !== e.id); close(); render(); toast("Η καταχώρηση διαγράφηκε"); } }); }
    else { b.dataset.armed = "1"; b.textContent = "Πάτα ξανά για διαγραφή"; } };
  if(pre.fromTimer) $("#tm-discard").onclick = () => { setTimer(null); close(); render(); toast("Το χρονόμετρο μηδενίστηκε"); };
}

const R = { preset:"month", from:"", to:"", client:"", tech:"" };
function presetRange(p){
  const today = athensParts(nowIso()).date, [y,m] = today.split("-").map(Number);
  const mStart = (yy, mm) => `${yy}-${String(mm).padStart(2,"0")}-01`;
  const mEnd = (yy, mm) => addDays(mm === 12 ? mStart(yy+1, 1) : mStart(yy, mm+1), -1);
  if(p === "month") return [mStart(y,m), mEnd(y,m)];
  if(p === "last"){ const yy = m === 1 ? y-1 : y, mm = m === 1 ? 12 : m-1; return [mStart(yy,mm), mEnd(yy,mm)]; }
  if(p === "week"){ const dow = (new Date(today + "T00:00:00Z").getUTCDay() + 6) % 7; const s = addDays(today, -dow); return [s, addDays(s, 6)]; }
  if(p === "year") return [`${y}-01-01`, `${y}-12-31`];
  return [R.from || mStart(y,m), R.to || today];
}
function reportData(){
  if(R.preset !== "custom") [R.from, R.to] = presetRange(R.preset);
  const a = fromLocal(R.from, "00:00"), b = fromLocal(addDays(R.to, 1), "00:00");
  const inR = iso => iso && new Date(iso) >= a && new Date(iso) < b;
  const ent = S.time.filter(e => inR(e.start) && (!R.client || e.client === R.client) && (!R.tech || (e.tech || "").toLowerCase() === R.tech.toLowerCase()))
    .sort((x,y) => new Date(x.start) - new Date(y.start));
  const tk = S.tickets.filter(t => !R.client || t.client === R.client).filter(t => !R.tech || (t.tech || "").toLowerCase() === R.tech.toLowerCase());
  const created = tk.filter(t => inR(t.created)), resolved = tk.filter(t => inR(t.resolved));
  const withSla = resolved.filter(t => t.resolveDue), met = withSla.filter(t => new Date(t.resolved) <= new Date(t.resolveDue)).length;
  const sum = arr => arr.reduce((s,e) => s + e.minutes, 0);
  const group = key => { const o = {}; ent.forEach(e => { const k = key(e) || "—"; (o[k] ||= { min:0, bill:0, n:0, tickets:new Set() }); o[k].min += e.minutes; if(e.billable) o[k].bill += e.minutes; o[k].n++; o[k].tickets.add(e.ref); }); return Object.entries(o).sort((x,y) => y[1].min - x[1].min); };
  return { ent, total:sum(ent), bill:sum(ent.filter(e => e.billable)), created, resolved, slaPct: withSla.length ? Math.round(met / withSla.length * 100) : null,
    byClient:group(e => e.client || L("Χωρίς πελάτη")), byTech:group(e => e.techName || techName(e.tech)), byTicket:group(e => String(e.ref)), byKind:group(e => L(e.kind)) };
}

function dayChart(ent){
  const days = []; for(let x = R.from; x <= R.to && days.length < 400; x = addDays(x, 1)) days.push(x);
  const monthly = days.length > 62;
  const keys = monthly ? [...new Set(days.map(x => x.slice(0,7)))] : days;
  const tot = {}, bil = {}; ent.forEach(e => { const k = athensParts(e.start).date.slice(0, monthly ? 7 : 10); tot[k] = (tot[k] || 0) + e.minutes; if(e.billable) bil[k] = (bil[k] || 0) + e.minutes; });
  const maxH = Math.max(1, ...keys.map(k => (tot[k] || 0) / 60)), W = 560, H = 160, pad = 26, bw = (W - pad) / keys.length;
  const y = v => H - 18 - (v / maxH) * (H - 30);
  const step = Math.ceil(keys.length / (monthly ? 12 : 10));
  let s = [0, maxH/2, maxH].map(v => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--dim)">${Math.round(v*10)/10}</text>`).join("");
  keys.forEach((k,i) => {
    const x = pad + i*bw, h = (tot[k] || 0)/60, hb = (bil[k] || 0)/60, w = Math.max(2, bw*0.62), lab = monthly ? `${k.slice(5)}/${k.slice(2,4)}` : `${+k.slice(8)}/${+k.slice(5,7)}`;
    if(h) s += `<rect x="${x+(bw-w)/2}" y="${y(h)}" width="${w}" height="${H-18-y(h)}" rx="2" fill="var(--primary)"><title>${monthly ? lab : fmtDay(k)}: ${fmtDur(h*60)} ${T("ώρες","hours")}</title></rect>`;
    if(hb) s += `<rect x="${x+(bw-w)/2}" y="${y(hb)}" width="${w}" height="${H-18-y(hb)}" rx="2" fill="var(--orange)"><title>${monthly ? lab : fmtDay(k)}: ${fmtDur(hb*60)} ${T("χρεώσιμες","billable")}</title></rect>`;
    if(i % step === 0) s += `<text x="${x+bw/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="var(--dim)">${lab}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${T(`Ώρες εργασίας ανά ${monthly ? "μήνα" : "ημέρα"}`, `Hours worked per ${monthly ? "month" : "day"}`)}">${s}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>Ώρες</span><span><i style="background:var(--orange)"></i>Χρεώσιμες</span></div>`;
}
function exportCsv(d){
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const head = LANG === "en" ? ["Date","From","To","Minutes","Hours","Ticket","Subject","Customer","Technician","Type","Billable","Work"] : ["Ημερομηνία","Από","Έως","Λεπτά","Ώρες","Ticket","Θέμα","Πελάτης","Τεχνικός","Τύπος","Χρεώσιμο","Εργασία"];
  const rows = d.ent.map(e => { const a = athensParts(e.start), b = athensParts(e.end), t = S.tickets.find(x => x.id === e.ref);
    return [fmtDay(a.date), a.time, b.time, e.minutes, decH(e.minutes), e.no, t?.title || "", e.client, e.techName || techName(e.tech), L(e.kind), e.billable ? T("Ναι","Yes") : T("Όχι","No"), e.note]; });
  const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(";")).join("\r\n");

}


/* ================= notifications (sound + system bar) ================= */
const NOTIFY_KEY = "praxis-notify", SEEN_KEY = "praxis-notified";
const notifyOn = () => { try { return localStorage.getItem(NOTIFY_KEY) === "on"; } catch(_){ return false; } };
let audioCtx = null, swReg = null;
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === "suspended") audioCtx.resume(); } catch(_){} }
document.addEventListener("pointerdown", unlockAudio, { once:true });
function chime(urgent){
  if(!audioCtx) return;
  const notes = urgent ? [880, 660, 880, 660] : [660, 880];
  notes.forEach((f, i) => {
    const o = audioCtx.createOscillator(), gn = audioCtx.createGain(), t0 = audioCtx.currentTime + i * 0.18;
    o.type = "sine"; o.frequency.value = f;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.17);
    o.connect(gn).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.18);
  });
}
function seenSet(){ try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); } catch(_){ return new Set(); } }
function markSeen(key){ try { const s = [...seenSet(), key].slice(-300); localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch(_){} }
async function notify(title, body, hash, opts = {}){
  if(opts.once){ if(seenSet().has(opts.once)) return; markSeen(opts.once); }
  if(!notifyOn()) return;
  title = L(title); body = L(body);
  chime(opts.urgent);
  toast(`${title}: ${body}`);
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const url = "./" + (hash || "");
  const o = { body, tag:opts.tag || hash || title, renotify:true, icon:"icon-192.png", badge:"icon-192.png", data:{ url }, requireInteraction:!!opts.urgent };
  try { if(swReg) { await swReg.showNotification(title, o); return; } } catch(_){}
  try { const n = new Notification(title, o); n.onclick = () => { window.focus(); location.hash = hash || ""; n.close(); }; } catch(_){}
}
async function setupSW(){
  if(!("serviceWorker" in navigator)) return;
  try { swReg = await navigator.serviceWorker.register("sw.js"); } catch(_){}
  navigator.serviceWorker.addEventListener("message", e => { if(e.data?.type === "open"){ const h = new URL(e.data.url).hash; if(h) location.hash = h; } });
}
async function toggleNotify(){
  unlockAudio();
  if(notifyOn()){ try { localStorage.setItem(NOTIFY_KEY, "off"); } catch(_){} paintBell(); toast("Οι ειδοποιήσεις απενεργοποιήθηκαν"); return; }
  if("Notification" in window && Notification.permission === "default"){ try { await Notification.requestPermission(); } catch(_){} }
  try { localStorage.setItem(NOTIFY_KEY, "on"); } catch(_){}
  paintBell();
  const denied = "Notification" in window && Notification.permission === "denied";
  await notify("Ειδοποιήσεις ενεργές", denied ? "Μόνο ήχος: ο browser έχει μπλοκάρει τις ειδοποιήσεις στη μπάρα." : "Θα ακούς ήχο και θα βλέπεις μήνυμα στη μπάρα.", "", { tag:"test" });
}
function paintBell(){
  const on = notifyOn();
  document.querySelectorAll("[data-act='bell']").forEach(b => { b.innerHTML = (on ? ICON.bell : ICON.belloff) + (b.dataset.label ? `<span>${on ? "Ειδοποιήσεις ενεργές" : "Ενεργοποίηση ειδοποιήσεων"}</span>` : ""); b.setAttribute("aria-pressed", on); b.title = on ? "Απενεργοποίηση ειδοποιήσεων" : "Ενεργοποίηση ειδοποιήσεων"; });
}

/* what changed since the last check */
let snap = null;
function takeSnap(){ snap = new Map(S.tickets.map(t => [t.id, t.last || t.created])); }
async function checkChanges(){
  if(!snap){ takeSnap(); return; }
  for(const t of S.tickets){
    const before = snap.get(t.id);
    if(before === undefined){
      notify(T(`Νέο ticket ${t.no}`, `New ticket ${t.no}`), `${t.title}${t.client ? `, ${t.client}` : ""}`, "#t" + t.id, { once:`new:${t.id}` });
      continue;
    }
    const now = t.last || t.created;
    if(now && before && new Date(now) - new Date(before) > 5000){
      const cs = await API.comments(t.id).catch(() => []);
      const r = cs.filter(c => c.dir === (S.customer ? DIR.OUT : DIR.IN) && new Date(c.created) > new Date(before)).sort((a,b) => new Date(b.created) - new Date(a.created))[0];
      if(r){
        notify(S.customer ? T(`Νέα απάντηση στο ${t.no}`, `New reply on ${t.no}`) : T(`Απάντηση πελάτη στο ${t.no}`, `Customer reply on ${t.no}`), (r.body || "").replace(/\s+/g," ").slice(0,140) || t.title, "#t" + t.id, { once:`reply:${r.id}` });
        if(S.open && S.open.id === t.id && S.view === "ticket"){ S.comments = cs; renderTimeline(); }
      }
    }
  }
  takeSnap();
}
function checkSla(){
  S.tickets.filter(t => OPEN.includes(t.status)).forEach(t => {
    const s = slaState(t); if(!s || !(s.risk || s.breach)) return;
    const phase = t.firstResp ? "resolve" : "response";
    if(s.breach) notify(T(`Έληξε το SLA στο ${t.no}`, `SLA breached on ${t.no}`), `${phase === "response" ? T("Απόκριση","Response") : T("Επίλυση","Resolution")}: ${t.title}, ${t.client || ""}`, "#t" + t.id, { once:`breach:${t.id}:${phase}:${t.due}:${t.resolveDue}`, urgent:true });
    else notify(T(`SLA σε κίνδυνο στο ${t.no}`, `SLA at risk on ${t.no}`), `${s.label}. ${t.title}`, "#t" + t.id, { once:`risk:${t.id}:${phase}:${t.due}:${t.resolveDue}`, urgent:true });
  });
}
function checkTimer(){
  const tm = getTimer(); if(!tm) return;
  const h = (Date.now() - new Date(tm.start)) / 3600000; if(h < 2) return;
  const t = S.tickets.find(x => x.id === tm.ref);
  notify("Το χρονόμετρο τρέχει ακόμα", T(`${t ? t.no + ", " : ""}${Math.floor(h)} ώρες. Μήπως ξέχασες να το σταματήσεις;`, `${t ? t.no + ", " : ""}${Math.floor(h)} hours. Did you forget to stop it?`), "#t" + tm.ref, { once:`timer:${tm.start}:${Math.floor(h/2)}` });
}
async function poll(){
  if(!S.me.name || DEMO) return;
  const editing = !!$("#mov") || S.view === "ticket";
  try { await API.load(); } catch(_){ return; }
  if(S.open){ const fresh = S.tickets.find(t => t.id === S.open.id); if(fresh){ const i = S.tickets.indexOf(fresh); S.tickets[i] = Object.assign(S.open, fresh); } }
  await checkChanges(); if(!S.customer){ checkSla(); checkTimer(); }
  if(!editing) render();
}

  chosen.pfiles = []; $("#pchips").innerHTML = "";
  ta.value = ""; renderTimeline(); toast(L("Στάλθηκε. Ο τεχνικός θα το δει σε 1–2 λεπτά."));
  const reload = async () => { if(S.open && S.open.id === t.id){ const cs = await API.comments(t.id).catch(() => null); if(cs && S.open && S.open.id === t.id){ S.comments = cs; renderTimeline(); loadFiles(t); } } };
  setTimeout(reload, 70000); setTimeout(reload, 130000);
}
function renderPortal(m){
  if(S.view === "ticket" && S.open) return renderPortalTicket(m);
  const open = t => OPEN.includes(t.status);
  const rows = S.tickets.filter(t => pFilter === "all" ? true : pFilter === "open" ? open(t) : !open(t))
    .sort((a,b) => new Date(b.last || b.created) - new Date(a.last || a.created));
  const cnt = k => S.tickets.filter(t => k === "all" ? true : k === "open" ? open(t) : !open(t)).length;
  const pend = pFilter === "done" ? [] : pendingNew();
  const client = portalClient();
  m.innerHTML = `${portalTop()}
  <div class="page-head"><h1>Αιτήματα${client ? `<small class="ph-sub">${esc(client)}</small>` : ""}</h1><div class="sp"></div>
    <button class="btn cta" id="pNew">${ICON.plus}Νέο αίτημα</button></div>
  <p class="portal-note">${T(`Ανοίξτε νέο αίτημα από εδώ ή με email στο ${esc(SUPPORT)}.`, `Open a new request here or by email to ${esc(SUPPORT)}.`)}</p>
  <div class="filters" role="tablist">${[["open","Ανοιχτά"],["done","Ολοκληρωμένα"],["all","Όλα"]].map(([k,l]) => `<button role="tab" class="${pFilter === k ? "on" : ""}" aria-selected="${pFilter === k}" data-pf="${k}">${l}<em>${cnt(k)}</em></button>`).join("")}</div>
  <div class="table">
    <div class="trow thead prow"><span class="c-no">Αριθμός</span><span>Θέμα</span><span class="c-status">Κατάσταση</span><span class="c-type">Τελευταία κίνηση</span></div>
    ${pend.map(p => `<div class="trow prow pending-row">
      <span class="tno c-no">—</span>
      <span style="min-width:0"><span class="ttl" style="display:block">${esc(p.title)}</span><span class="tsub">${esc(S.me.name)}, ${fmt(p.created)}</span></span>
      <span class="c-status"><span class="status st-new">Καταχωρείται…</span></span>
      <span class="tsub c-type">${ago(p.created)}</span></div>`).join("")}
    ${rows.length ? rows.map(t => `<button class="trow prow" data-id="${t.id}">
      <span class="tno c-no">${esc(t.no)}</span>
      <span style="min-width:0"><span class="ttl" style="display:block">${esc(t.title)}</span><span class="tsub">${esc(t.reqName || t.reqEmail || "")}${t.reqName || t.reqEmail ? ", " : ""}${fmt(t.created)}</span></span>
      <span class="c-status">${pStatus(t.status)}</span>
      <span class="tsub c-type">${ago(t.last || t.created)}</span></button>`).join("")
      : pend.length ? "" : `<div class="empty">${S.tickets.length ? "Δεν υπάρχουν αιτήματα σε αυτή την προβολή." : "Δεν υπάρχουν ακόμα αιτήματα για την εταιρεία σας."}</div>`}
  </div>`;
  m.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { pFilter = b.dataset.pf; renderPortal(m); });
  $("#pNew").onclick = portalNew;
  bindCommon(m);
}
function renderPortalTicket(m){
  const t = S.open;
  m.innerHTML = `${portalTop()}
  <button class="back" id="backBtn">${ICON.back}Αιτήματα</button>
  <div class="detail">
    <div style="min-width:0">
      <div class="dhead"><div class="meta">${esc(t.no)}, ${fmt(t.created)}</div><h1>${esc(t.title)}</h1>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">${pStatus(t.status)}</div></div>
      <div class="timeline" id="tl"><div class="spin" style="margin:24px auto"></div></div>
      <div class="composer portal-reply">
        ${t.status === "Κλειστό" || t.status === "Επιλύθηκε" ? `<p class="portal-hint">${L(t.status === "Κλειστό" ? "Το αίτημα έχει ολοκληρωθεί. Αν το θέμα εμφανίστηκε ξανά, γράψτε εδώ και θα ανοίξει ξανά." : "Η απάντησή σας πηγαίνει στον τεχνικό και εμφανίζεται εδώ σε 1–2 λεπτά.")}</p>` : ""}
        <textarea id="pbody" aria-label="Η απάντησή σας" placeholder="Γράψτε την απάντησή σας ή στοιχεία που ζητήσαμε"></textarea>
        <div class="chips" id="pchips"></div>
        <div class="crow">
          <label class="btn quiet attach">${ICON.clip}Επισύναψη<input type="file" id="pfiles" multiple hidden></label>
          <span class="sp" style="flex:1"></span>
          <a class="mlink" href="${mailto(`[${t.no}] ${t.title}`)}">Με email</a>
          <button class="btn" id="psend">Αποστολή</button>
        </div>
      </div>
      ${filesPanelHtml(t, false)}
    </div>
    <div class="props">
      <div class="prop"><span class="k">Κατάσταση</span><div class="v">${pStatus(t.status)}</div></div>
      <div class="prop"><span class="k">Τεχνικός</span><div class="v">${t.tech ? esc(techName(t.tech)) : "Θα ανατεθεί σύντομα"}</div></div>
      <div class="prop"><span class="k">Άνοιξε από</span><div class="v">${esc(t.reqName || t.reqEmail || "—")}</div></div>
      <div class="prop"><span class="k">Καταχωρήθηκε</span><div class="v">${fmt(t.created)}</div></div>
      ${t.resolved ? `<div class="prop"><span class="k">Επιλύθηκε</span><div class="v">${fmt(t.resolved)}</div></div>` : ""}
    </div>
  </div>`;
  $("#backBtn").onclick = () => { S.open = null; go("tickets"); };
  $("#psend").onclick = () => portalReply(t);
  bindChips("pfiles", "pchips");
  if(S.comments) renderTimeline();
  if(S.comments) loadFiles(t);
}

/* ================= modal ================= */
function modal(title, html, onSave, extra){
  $("#layer").innerHTML = `<div class="overlay" id="mov"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header id="mt">${esc(title)}</header>
    <form id="mform">${html}<div class="acts">${extra || ""}<span class="sp"></span><button type="button" class="btn quiet" id="mcancel">Άκυρο</button><button class="btn" id="msave">Αποθήκευση</button></div></form></div>`;
  const close = () => { $("#layer").innerHTML = ""; };
  $("#mov").onclick = close; $("#mcancel").onclick = close;
  $("#mform").onsubmit = async e => { e.preventDefault(); $("#msave").disabled = true; const fd = Object.fromEntries(new FormData(e.target)); if(await onSave(fd) !== false) close(); else $("#msave").disabled = false; };
  setTimeout(() => $("#mform input, #mform select")?.focus(), 30);
  return close;
}
function newTicket(){
  const clientOpts = [["","Επίλεξε πελάτη"], ...S.clients.slice().sort((a,b) => a.name.localeCompare(b.name,"el")).map(c => [String(c.id), c.name])];
  modal("Νέο ticket", `
    <label>Πελάτης<select class="field" name="clientId">${opt(clientOpts,"")}</select></label>
    <div class="grid2"><label>Όνομα αιτούντος<input class="field" name="reqName"></label><label>Email αιτούντος<input class="field" name="reqEmail" type="email"></label></div>
    <label>Θέμα<input class="field" name="title" required></label>
    <label>Περιγραφή<textarea class="field" name="desc" rows="4"></textarea></label>
    <div class="grid2">
      <label>Τύπος<select class="field" name="type">${opt(TYPES,"Περιστατικό")}</select></label>
      <label>Κατηγορία<select class="field" name="category">${opt(CATEGORIES,"Άλλο")}</select></label>
      <label>Επίπτωση<select class="field" name="impact" id="n-imp">${LEVELS.map(l => `<option value="${l}"${l === "Μεσαία" ? " selected" : ""}>${L(l)}: ${L(IMPACT_HINT[l])}</option>`).join("")}</select></label>
      <label>Επείγον<select class="field" name="urgency" id="n-urg">${LEVELS.map(l => `<option value="${l}"${l === "Μεσαία" ? " selected" : ""}>${L(l)}: ${L(URGENCY_HINT[l])}</option>`).join("")}</select></label>
      <label>Πηγή<select class="field" name="source">${opt(SOURCES,"Τηλέφωνο")}</select></label>
      <label>Τεχνικός<select class="field" name="tech">${opt([["","Χωρίς ανάθεση"], ...TECHS.map(x => [x.email, x.name])], S.me.email)}</select></label>
    </div>
    <div class="computed" id="n-prio"></div>`,
    async fd => {
      const c = S.clients.find(x => String(x.id) === fd.clientId);
      const priority = MATRIX[fd.impact][fd.urgency], created = nowIso(), tier = c ? c.tier : "Χωρίς σύμβαση";
      const dd = dueDates(created, tier, c?.sla, priority);
      const tech = fd.tech || (c && c.tech) || "";
      const obj = { title:fd.title, desc:fd.desc, type:fd.type, category:fd.category, impact:fd.impact, urgency:fd.urgency, priority,
        source:fd.source, tech, reqName:fd.reqName, reqEmail:fd.reqEmail, client:c ? c.name : "", tier,
        status: tech ? "Ανατέθηκε" : "Νέο", due:dd.due, resolveDue:dd.resolveDue, last:created, slaAlerted:false, resolveAlerted:false };
      const t = await guard(() => API.createTicket(obj));
      if(!t) return false;
      if(!t.created) t.created = created;
      S.tickets.unshift(t);
      await guard(() => API.addComment({ ref:t.id, body:`Δημιουργήθηκε από ${S.me.name} (${fd.source})`, dir:DIR.SYS, author:S.me.name }));
      toast(T(`Δημιουργήθηκε το ${t.no}`, `${t.no} created`)); openTicket(t.id);
    });
  const upd = () => { const p = MATRIX[$("#n-imp").value][$("#n-urg").value]; $("#n-prio").textContent = T(`Προτεραιότητα: ${p}. Αλλάζει αργότερα από το ticket, με αιτιολόγηση.`, `Priority: ${L(p)}. You can change it later in the ticket, with a reason.`); };
  $("#n-imp").onchange = upd; $("#n-urg").onchange = upd; upd();
}

/* ================= clients ================= */
function renderClients(m){
  const q = S.q.trim().toLowerCase();
  const rows = S.clients.filter(c => !q || (c.name + " " + c.domain).toLowerCase().includes(q)).sort((a,b) => a.name.localeCompare(b.name,"el"));
  const openCnt = n => S.tickets.filter(t => t.client === n && OPEN.includes(t.status)).length;
  m.innerHTML = `${mtop()}${demoBanner()}
  <div class="page-head"><h1>Πελάτες</h1><div class="sp"></div>
    <input class="field search" id="q" type="search" placeholder="Αναζήτηση πελάτη ή domain" value="${esc(S.q)}" aria-label="Αναζήτηση">
    <button class="btn" id="addCl">${ICON.plus}Νέος πελάτης</button></div>
  <p style="color:var(--dim);margin:-8px 0 16px;font-size:14px;max-width:70ch">Τα email που έρχονται από το domain ενός πελάτη συνδέονται αυτόματα μαζί του και παίρνουν το SLA του πακέτου του.</p>
  <div class="table">
    <div class="trow thead" style="grid-template-columns:minmax(0,1fr) 140px 120px 90px"><span>Πελάτης</span><span>Πακέτο</span><span class="c-type">Τηλέφωνο</span><span>Ανοιχτά</span></div>
    ${rows.length ? rows.map(c => `<button class="trow" data-cid="${c.id}" style="grid-template-columns:minmax(0,1fr) 140px 120px 90px">
      <span style="min-width:0"><span class="ttl" style="display:block">${esc(c.name)}</span><span class="tsub">${esc(c.domain || "χωρίς domain")}</span></span>
      <span class="tsub">${esc(L(c.tier))}${+c.sla ? `, ${esc(c.sla)}${T("ω","h")}` : ""}${c.lang === "EN" ? ", EN" : ""}</span><span class="tsub c-type">${esc(c.phone || "—")}</span><span class="tsub">${openCnt(c.name)}</span></button>`).join("")
      : `<div class="empty">${S.q ? "Κανένας πελάτης δεν ταιριάζει." : "Πρόσθεσε τον πρώτο σου πελάτη για να αντιστοιχίζονται αυτόματα τα email του."}</div>`}
  </div>`;
  const qi = $("#q"); qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; renderClients(m); const n = $("#q"); n.focus(); n.setSelectionRange(p,p); };
  $("#addCl").onclick = () => editClient();
  m.querySelectorAll("[data-cid]").forEach(b => b.onclick = () => editClient(S.clients.find(c => c.id === +b.dataset.cid)));
  m.querySelectorAll('[data-act="refresh"]').forEach(b => b.onclick = refresh);
}
function portalStatus(c){
  const norm = v => (v || "").toLowerCase().replace(/[\s,]+/g, ";").replace(/;+/g, ";").replace(/^;|;$/g, "");
  if(!c.id || !norm(c.portalUsers)) return "Βλέπουν όλα τα αιτήματα της εταιρείας τους, χωρίς ώρες εργασίας και εσωτερικές σημειώσεις. Θα λάβουν email πρόσκλησης.";
  return norm(c.portalUsers) === norm(c.portalSynced) ? "Η πρόσβαση είναι ενεργή για αυτούς τους χρήστες." : "Η πρόσβαση ενημερώνεται, σε 1–2 λεπτά.";
}
function editClient(c){
  c = c || { lang:"EL", name:"", domain:"", tier:"Business", sla:CFG.tierSla?.Business ?? 4, tech:TECHS[0]?.email || "", phone:"", notes:"" };
  const close = modal(c.id ? "Στοιχεία πελάτη" : "Νέος πελάτης", `
    <label>Επωνυμία<input class="field" name="name" required value="${esc(c.name)}"></label>
    <label>Domain email, πολλά χωρισμένα με ;<input class="field" name="domain" placeholder="example.gr; example.com" value="${esc(c.domain)}"></label>
    <div class="grid2"><label>Πακέτο<select class="field" name="tier" id="tierSel">${opt(TIERS, c.tier)}</select></label>
    <label>Μέγιστη πρώτη απόκριση, εργάσιμες ώρες<input class="field" name="sla" id="slaIn" type="number" min="0" step="0.5" value="${esc(c.sla)}"></label>
    <label>Τεχνικός<select class="field" name="tech">${opt([["","Χωρίς"], ...TECHS.map(x => [x.email, x.name])], c.tech)}</select></label>
    <label>Τηλέφωνο<input class="field" name="phone" value="${esc(c.phone)}"></label></div>
    <div class="grid2"><label>Γλώσσα email πελάτη<select class="field" name="lang" translate="no">${opt([["EL","Ελληνικά"],["EN","English"]], c.lang || "EL")}</select></label><span></span></div>
    <label>Σημειώσεις<textarea class="field" name="notes" rows="3">${esc(c.notes)}</textarea></label>
    <label>Χρήστες πύλης πελάτη, email χωρισμένα με ;<textarea class="field" name="portalUsers" rows="2" placeholder="maria@example.gr; giorgos@example.gr">${esc(c.portalUsers || "")}</textarea>
      <span class="pf-users">${portalStatus(c)}</span></label>`,
    async fd => {
      const users = (fd.portalUsers || "").toLowerCase().split(/[\s,;]+/).filter(x => x.includes("@"));
      const bad = users.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      if(bad.length){ toast(T("Μη έγκυρο email: ", "Invalid email: ") + bad.join(", "), true); return false; }
      const obj = { ...fd, domain:fd.domain.toLowerCase().replace(/\s+/g,""), sla:fd.sla === "" ? 0 : +fd.sla, portalUsers:[...new Set(users)].join(";") };
      if(c.id) obj.id = c.id;
      const r = await guard(() => API.saveClient(obj)); if(!r) return false;
      if(c.id) Object.assign(c, obj); else S.clients.push(r);
      render(); toast("Αποθηκεύτηκε");
    }, c.id ? `<button type="button" class="btn danger" id="delCl">Διαγραφή</button>` : "");
  $("#tierSel").onchange = e => { const v = CFG.tierSla?.[e.target.value]; if(v != null) $("#slaIn").value = v; };
  if(c.id) $("#delCl").onclick = () => {
    const b = $("#delCl");
    if(b.dataset.armed){ guard(async () => { await API.deleteClient(c.id); return true; }).then(ok => { if(ok){ S.clients = S.clients.filter(x => x.id !== c.id); close(); render(); toast("Ο πελάτης διαγράφηκε"); } }); }
    else { b.dataset.armed = "1"; b.textContent = "Πάτα ξανά για διαγραφή"; }
  };
}

/* ================= boot ================= */
async function refresh(){ await guard(() => API.load()); if(S.open){ S.open = S.tickets.find(t => t.id === S.open.id) || null; if(S.open){ openTicket(S.open.id, false); return; } } render(); toast("Ενημερώθηκε"); }
function route(){
  const h = location.hash;
  const m = h.match(/^#t(\d+)$/);
  if(m && S.tickets.some(t => t.id === +m[1])){ openTicket(+m[1], false); return; }
  S.open = null; S.view = S.customer ? "tickets" : ["dash","tickets","clients","reports"].includes(h.slice(1)) ? h.slice(1) : "dash"; render();
}
function gate(inner){ $("#root").innerHTML = `<div class="gate"><div class="card"><div class="logo">Praxis<b>IT</b><span>Tickets</span></div>${inner}<div class="lang-row">${langBtn("")}</div></div></div>`; }
async function boot(){
  const st = await guard(() => API.start());
  if(st === "login"){ gate(`<p>Συνδέσου με το email εργασίας σου. Αν δεν έχεις λογαριασμό Microsoft, θα λάβεις κωδικό στο email.</p><button class="btn" id="loginBtn">Σύνδεση με Microsoft</button>`); $("#loginBtn").onclick = () => API.login(); return; }
  if(st !== "ok"){ gate(`<p>Δεν ήταν δυνατή η σύνδεση με το SharePoint. Έλεγξε τη σύνδεση στο internet και δοκίμασε ξανά.</p><button class="btn" onclick="location.reload()">Δοκιμή ξανά</button>`); return; }
  await guard(() => API.load());
  if(S.customer) renderPortalShell(); else renderShell();
  route();
  takeSnap(); setupSW(); if(!S.customer){ checkSla(); checkTimer(); }
}
window.addEventListener("popstate", route);
document.addEventListener("keydown", e => { if(e.key === "Escape" && $("#mov")) $("#mov").click(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") poll(); });
setInterval(poll, 60000);
boot();
</script>
</body>
</html>
